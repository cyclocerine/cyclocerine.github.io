<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timetable 24 SKS - Teknik Informatika</title>
  
  <link id="manifest-placeholder" rel="manifest" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="Aplikasi Timetable Mingguan 24 SKS Teknik Informatika PWA" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }

  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">

    body {

    }

      display: none;
    }

      -ms-overflow-style: none;
      scrollbar-width: none;

<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-300 pb-16">

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 glass-card border-b border-slate-200/80 dark:border-slate-800/80 transition-colors duration-300">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-white font-black text-lg shadow-md shadow-indigo-500/20">
          24
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-tight">
            Timetable Kuliah
          </h1>
          <p class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
            Updated 24 SKS - IF
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Live Clock -->
        <div id="live-clock" class="hidden sm:flex items-center px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-mono font-medium text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700">
          00:00:00 WIB
        </div>

        <!-- Theme Switcher -->
        <button id="theme-toggle" onclick="toggleTheme()" class="p-2.5 rounded-2xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-all border border-slate-200/80 dark:border-slate-700/80" title="Ubah Tema">
          <svg id="sun-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg id="moon-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>

        <!-- Calendar Export -->
        <button onclick="exportICS()" class="hidden md:flex items-center gap-1.5 px-3 py-2 text-xs font-semibold rounded-2xl bg-indigo-50 hover:bg-indigo-100 text-indigo-600 dark:bg-indigo-950/60 dark:hover:bg-indigo-900/60 dark:text-indigo-300 transition border border-indigo-200 dark:border-indigo-800/50">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          Export (.ics)
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-5xl mx-auto px-4 pt-6 space-y-6">

    <!-- SUMMARY CARDS -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-200/80 dark:border-slate-800/80 shadow-xs flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Total Beban</p>
          <p class="text-xl font-bold text-slate-900 dark:text-white mt-0.5">24 SKS</p>
        </div>
        <div class="w-10 h-10 rounded-2xl bg-indigo-50 dark:bg-indigo-950/80 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        </div>
      </div>

      <div class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-200/80 dark:border-slate-800/80 shadow-xs flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Mata Kuliah</p>
          <p class="text-xl font-bold text-slate-900 dark:text-white mt-0.5">11 Matkul</p>
        </div>
        <div class="w-10 h-10 rounded-2xl bg-emerald-50 dark:bg-emerald-950/80 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
        </div>
      </div>

      <div class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-200/80 dark:border-slate-800/80 shadow-xs flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Hari Aktif</p>
          <p class="text-xl font-bold text-slate-900 dark:text-white mt-0.5">Senin - Jumat</p>
        </div>
        <div class="w-10 h-10 rounded-2xl bg-amber-50 dark:bg-amber-950/80 text-amber-600 dark:text-amber-400 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </div>
      </div>

      <div class="bg-white dark:bg-slate-900 p-4 rounded-3xl border border-slate-200/80 dark:border-slate-800/80 shadow-xs flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 dark:text-slate-400 font-medium" id="today-sks-label">SKS Hari Ini</p>
          <p id="today-sks-count" class="text-xl font-bold text-indigo-600 dark:text-indigo-400 mt-0.5">0 SKS</p>
        </div>
        <div class="w-10 h-10 rounded-2xl bg-purple-50 dark:bg-purple-950/80 text-purple-600 dark:text-purple-400 flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 bg-white dark:bg-slate-900 p-2.5 rounded-3xl border border-slate-200/80 dark:border-slate-800/80 shadow-xs">
      <div class="relative flex-1">
        <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Cari matkul, ruang, atau dosen..." 
          oninput="handleSearch()"
          class="w-full pl-10 pr-4 py-2 text-sm bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/80 rounded-2xl focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white placeholder-slate-400 transition"
        />
      </div>

      <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-2xl self-end sm:self-auto">
        <button id="view-tab-btn" onclick="setViewMode('tabs')" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-white bg-indigo-600 shadow-xs transition">
          Per Hari
        </button>
        <button id="view-full-btn" onclick="setViewMode('full')" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
          Semua Hari
        </button>
      </div>
    </div>

    <!-- DAY TABS -->
    <div id="day-tabs-container" class="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
      <button onclick="selectDay('Senin')" id="tab-Senin" class="day-tab flex-1 min-w-[100px] py-3 px-4 rounded-2xl font-semibold text-sm transition-all text-center border relative">
        <span class="day-label">Senin</span>
        <span class="block text-[10px] font-normal opacity-80 mt-0.5">4 SKS</span>
      </button>
      <button onclick="selectDay('Selasa')" id="tab-Selasa" class="day-tab flex-1 min-w-[100px] py-3 px-4 rounded-2xl font-semibold text-sm transition-all text-center border relative">
        <span class="day-label">Selasa</span>
        <span class="block text-[10px] font-normal opacity-80 mt-0.5">7 SKS</span>
      </button>
      <button onclick="selectDay('Rabu')" id="tab-Rabu" class="day-tab flex-1 min-w-[100px] py-3 px-4 rounded-2xl font-semibold text-sm transition-all text-center border relative">
        <span class="day-label">Rabu</span>
        <span class="block text-[10px] font-normal opacity-80 mt-0.5">7 SKS</span>
      </button>
      <button onclick="selectDay('Kamis')" id="tab-Kamis" class="day-tab flex-1 min-w-[100px] py-3 px-4 rounded-2xl font-semibold text-sm transition-all text-center border relative">
        <span class="day-label">Kamis</span>
        <span class="block text-[10px] font-normal opacity-80 mt-0.5">1 SKS</span>
      </button>
      <button onclick="selectDay('Jumat')" id="tab-Jumat" class="day-tab flex-1 min-w-[100px] py-3 px-4 rounded-2xl font-semibold text-sm transition-all text-center border relative">
        <span class="day-label">Jumat</span>
        <span class="block text-[10px] font-normal opacity-80 mt-0.5">5 SKS</span>
      </button>
    </div>

    <!-- SCHEDULE LIST -->
    <div id="schedule-content" class="space-y-4 min-h-[300px]"></div>

  </main>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2 text-xs font-semibold">
    <svg class="w-4 h-4 text-emerald-400 dark:text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
    </svg>
    <span id="toast-message">Pesan notifikasi</span>
  </div>

  <script>
    const TIMETABLE_DATA = [
      {
        day: 'Senin',
        items: [
          { id: 'S1', timeStart: '07:30', timeEnd: '09:15', time: '07:30 - 09:15', title: 'Bela Negara dan Widya Mwat Yasa', sks: 2, classCode: 'IF-A', room: 'Patt.II-3D', lecturer: 'Heriyanto Dr. A.Md., S.Kom., M.Cs.', category: 'Teori', badgeColor: 'bg-blue-600' },
          { id: 'S2', timeStart: '12:30', timeEnd: '14:15', time: '12:30 - 14:15', title: 'Komputasi Numerik', sks: 2, classCode: 'IF-D', room: 'Patt.III-3A', lecturer: 'Frans Richard Kodong S.T., M.Kom., Ph.D', category: 'Teori', badgeColor: 'bg-indigo-600' }
        ]
      },
      {
        day: 'Selasa',
        items: [
          { id: 'SL1', timeStart: '07:30', timeEnd: '10:00', time: '07:30 - 10:00', title: 'Struktur Data', sks: 3, classCode: 'IF-E', room: 'Patt.II-3B', lecturer: 'Heru Cahya Rustamaji Dr. S.Si., M.T.', category: 'Teori', badgeColor: 'bg-emerald-600' },
          { id: 'SL2', timeStart: '10:00', timeEnd: '11:45', time: '10:00 - 11:45', title: 'Pemrograman Web', sks: 2, classCode: 'IF-B', room: 'Patt.II-3B', lecturer: 'Dessyanto Boedi P S.T., M.T.', category: 'Teori', badgeColor: 'bg-purple-600' },
          { id: 'SL3', timeStart: '15:00', timeEnd: '16:45', time: '15:00 - 16:45', title: 'Interaksi Manusia dan Komputer', sks: 2, classCode: 'IF-F', room: 'Patt.III-3B', lecturer: 'Aldila Putri Linanzha, S.Kom., M.Cs.', category: 'Teori', badgeColor: 'bg-rose-600' }
        ]
      },
      {
        day: 'Rabu',
        items: [
          { id: 'R1', timeStart: '10:00', timeEnd: '11:45', time: '10:00 - 11:45', title: 'Sistem Digital', sks: 2, classCode: 'IF-D', room: 'Patt.I-3A', lecturer: 'Budi Santosa S.Si., M.T.', category: 'Teori', badgeColor: 'bg-amber-600' },
          { id: 'R2', timeStart: '12:30', timeEnd: '15:00', time: '12:30 - 15:00', title: 'Geoinformatika', sks: 3, classCode: 'IF-D', room: 'Patt.II-2A', lecturer: 'Andiko Putro Suryotomo S.Kom., M.Cs.', category: 'Teori', badgeColor: 'bg-teal-600' },
          { id: 'R3', timeStart: '15:00', timeEnd: '16:45', time: '15:00 - 16:45', title: 'Bahasa Indonesia', sks: 2, classCode: 'IF-D', room: 'Patt.II-3B', lecturer: 'Hermanto S.Pd., M.Hum.', category: 'Teori', badgeColor: 'bg-cyan-600' }
        ]
      },
      {
        day: 'Kamis',
        items: [
          { id: 'K1', timeStart: '15:30', timeEnd: '17:30', time: '15:30 - 17:30', title: 'Praktikum Implementasi Struktur Data', sks: 1, classCode: 'IF-J', room: 'Laboratorium Komputasi', lecturer: 'Asisten Laboratorium', category: 'Praktikum', badgeColor: 'bg-fuchsia-600' }
        ]
      },
      {
        day: 'Jumat',
        items: [
          { id: 'J1', timeStart: '08:00', timeEnd: '10:00', time: '08:00 - 10:00', title: 'Praktikum Pemrograman Web', sks: 1, classCode: 'IF-L', room: 'Laboratorium Teknologi Mobile', lecturer: 'Asisten Laboratorium', category: 'Praktikum', badgeColor: 'bg-violet-600' },
          { id: 'J2', timeStart: '10:00', timeEnd: '11:45', time: '10:00 - 11:45', title: 'Riset Operasi (Baru)', sks: 2, classCode: 'IF-D', room: 'Patt.II-3C', lecturer: 'Bambang Yuwono S.T., M.T.', category: 'Teori', badgeColor: 'bg-orange-600' },
          { id: 'J3', timeStart: '15:30', timeEnd: '17:15', time: '15:30 - 17:15', title: 'Komputer dan Masyarakat', sks: 2, classCode: 'IF-F', room: 'Patt.II-3A', lecturer: 'Aldila Putri Linanzha, S.Kom., M.Cs.', category: 'Teori', badgeColor: 'bg-pink-600' }
        ]
      }
    ];

    let activeDay = 'Senin';
    let todayName = 'Senin';
    let isWeekend = false;
    let viewMode = 'tabs';
    let searchQuery = '';

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initPWA();
      setupTodayDay();
      updateClock();
      setInterval(updateClock, 1000);
      render();
      scrollTabIntoView(activeDay);
    });

    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
        document.getElementById('sun-icon').classList.remove('hidden');
        document.getElementById('moon-icon').classList.add('hidden');
      } else {
        document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');
        document.getElementById('sun-icon').classList.add('hidden');
        document.getElementById('moon-icon').classList.remove('hidden');
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      if (isDark) {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
        localStorage.setItem('theme', 'light');
        document.getElementById('sun-icon').classList.add('hidden');
        document.getElementById('moon-icon').classList.remove('hidden');
        showToast('Tema terang diaktifkan');
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
        localStorage.setItem('theme', 'dark');
        document.getElementById('sun-icon').classList.remove('hidden');
        document.getElementById('moon-icon').classList.add('hidden');
        showToast('Tema gelap diaktifkan');
      }
    }

    function setupTodayDay() {
      const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const todayIndex = new Date().getDay();
      todayName = days[todayIndex];
      
      if (TIMETABLE_DATA.some(d => d.day === todayName)) {
        activeDay = todayName;
        isWeekend = false;
      } else {
        // Sabtu atau Minggu
        activeDay = 'Senin';
        isWeekend = true;
      }
    }

    function scrollTabIntoView(day) {
      setTimeout(() => {
        const activeTabEl = document.getElementById(`tab-${day}`);
        if (activeTabEl) {
          activeTabEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      }, 100);
    }

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('live-clock').innerText = `${hours}:${mins}:${secs} WIB`;
    }

    function getClassStatus(day, timeStartStr, timeEndStr) {
      const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const now = new Date();
      const currentDayName = days[now.getDay()];

      if (currentDayName !== day) return { label: 'Terjadwal', color: 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400' };

      const [startH, startM] = timeStartStr.split(':').map(Number);
      const [endH, endM] = timeEndStr.split(':').map(Number);

      const currentMins = now.getHours() * 60 + now.getMinutes();
      const startMins = startH * 60 + startM;
      const endMins = endH * 60 + endM;

      if (currentMins >= startMins && currentMins <= endMins) {
        return { label: 'Sedang Berlangsung', color: 'bg-emerald-600 text-white animate-pulse' };
      } else if (currentMins < startMins) {
        return { label: 'Hari Ini', color: 'bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300' };
      } else {
        return { label: 'Selesai Hari Ini', color: 'bg-slate-200 text-slate-500 dark:bg-slate-800 dark:text-slate-500' };
      }
    }

    function selectDay(day) {
      activeDay = day;
      render();
      scrollTabIntoView(day);
    }

    function setViewMode(mode) {
      viewMode = mode;
      const tabBtn = document.getElementById('view-tab-btn');
      const fullBtn = document.getElementById('view-full-btn');
      const dayTabs = document.getElementById('day-tabs-container');

      if (mode === 'tabs') {
        tabBtn.className = 'px-3 py-1.5 rounded-xl text-xs font-semibold text-white bg-indigo-600 shadow-xs transition';
        fullBtn.className = 'px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition';
        dayTabs.classList.remove('hidden');
        scrollTabIntoView(activeDay);
      } else {
        fullBtn.className = 'px-3 py-1.5 rounded-xl text-xs font-semibold text-white bg-indigo-600 shadow-xs transition';
        tabBtn.className = 'px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition';
        dayTabs.classList.add('hidden');
      }
      render();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      render();
    }

    function copyInfo(title, room, lecturer) {
      const text = `${title}\nRuang: ${room}\nDosen: ${lecturer}`;
      navigator.clipboard.writeText(text).then(() => {
        showToast('Detail matkul berhasil disalin');
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      toastMsg.innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    function exportICS() {
      let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Timetable 24 SKS//ID\n";
      
      TIMETABLE_DATA.forEach(dayData => {
        dayData.items.forEach(item => {
          icsContent += `BEGIN:VEVENT\n`;
          icsContent += `SUMMARY:${item.title} (${item.classCode})\n`;
          icsContent += `LOCATION:${item.room}\n`;
          icsContent += `DESCRIPTION:SKS: ${item.sks} | Dosen: ${item.lecturer}\n`;
          icsContent += `END:VEVENT\n`;
        });
      });
      
      icsContent += "END:VCALENDAR";

      const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', 'Jadwal_Kuliah_24SKS.ics');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('File Kalender (.ics) berhasil diunduh');
    }

    function render() {
      const selectedDayData = TIMETABLE_DATA.find(d => d.day === activeDay);
      const selectedSKS = selectedDayData ? selectedDayData.items.reduce((acc, curr) => acc + curr.sks, 0) : 0;
      
      const sksLabelEl = document.getElementById('today-sks-label');
      if (activeDay === todayName) {
        sksLabelEl.innerText = 'SKS Hari Ini';
      } else {
        sksLabelEl.innerText = `SKS (${activeDay})`;
      }
      document.getElementById('today-sks-count').innerText = `${selectedSKS} SKS`;

      document.querySelectorAll('.day-tab').forEach(btn => {
        const day = btn.id.replace('tab-', '');
        const isCurrentRealDay = (day === todayName);
        
        let activeStyle = '';
        if (day === activeDay) {
          activeStyle = 'day-tab flex-1 min-w-[100px] py-3 px-4 rounded-2xl font-bold text-sm transition-all text-center bg-indigo-600 text-white shadow-md shadow-indigo-500/20 border-indigo-600 relative';
        } else {
          activeStyle = 'day-tab flex-1 min-w-[100px] py-3 px-4 rounded-2xl font-semibold text-sm transition-all text-center bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 border-slate-200/80 dark:border-slate-800/80 relative';
        }

        btn.className = activeStyle;

        // Visual Indicator Badge for Real Today
        const existingBadge = btn.querySelector('.today-indicator');
        if (existingBadge) existingBadge.remove();

        if (isCurrentRealDay) {
          const badge = document.createElement('span');
          badge.className = 'today-indicator absolute -top-1 -right-1 flex h-3 w-3';
          badge.innerHTML = `
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
          `;
          btn.appendChild(badge);
        }
      });

      const container = document.getElementById('schedule-content');

      let filteredSchedule = TIMETABLE_DATA.map(dayGroup => {
        const matchingItems = dayGroup.items.filter(item => {
          if (!searchQuery) return true;
          return item.title.toLowerCase().includes(searchQuery) ||
                 item.room.toLowerCase().includes(searchQuery) ||
                 item.lecturer.toLowerCase().includes(searchQuery) ||
                 item.classCode.toLowerCase().includes(searchQuery);
        });
        return { ...dayGroup, items: matchingItems };
      }).filter(dayGroup => dayGroup.items.length > 0);

      if (filteredSchedule.length === 0) {
        container.innerHTML = `
          <div class="bg-white dark:bg-slate-900 rounded-3xl p-8 text-center border border-slate-200 dark:border-slate-800 my-4">
            <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center mx-auto mb-3">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
            </div>
            <h3 class="font-bold text-slate-800 dark:text-white text-base">Mata Kuliah Tidak Ditemukan</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Coba kata kunci pencarian yang lain.</p>
          </div>
        `;
        return;
      }

      if (viewMode === 'tabs' && !searchQuery) {
        const daySchedule = filteredSchedule.find(d => d.day === activeDay);
        if (!daySchedule || daySchedule.items.length === 0) {
          container.innerHTML = `
            <div class="bg-white dark:bg-slate-900 rounded-3xl p-8 text-center border border-slate-200 dark:border-slate-800 my-4">
              <div class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center mx-auto mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
              </div>
              <h3 class="font-bold text-slate-800 dark:text-white text-base">Tidak Ada Jadwal Kuliah</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Hari ini bebas kuliah. Selamat beristirahat.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          ${isWeekend ? `
            <div class="bg-indigo-50/80 dark:bg-indigo-950/40 border border-indigo-200/80 dark:border-indigo-800/60 p-3.5 rounded-2xl flex items-center justify-between text-xs text-indigo-700 dark:text-indigo-300 font-medium">
              <span class="flex items-center gap-2">
                <svg class="w-4 h-4 text-indigo-600 dark:text-indigo-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Hari ini akhir pekan. Menampilkan jadwal hari Senin.
              </span>
            </div>
          ` : ''}
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${daySchedule.items.map(item => renderCard(daySchedule.day, item)).join('')}
          </div>
        `;
      } else {
        container.innerHTML = filteredSchedule.map(dayGroup => `
          <div class="space-y-3">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full ${dayGroup.day === todayName ? 'bg-emerald-500 animate-ping' : 'bg-indigo-600'}"></span>
              <h2 class="font-bold text-slate-900 dark:text-white text-base">${dayGroup.day}</h2>
              <span class="text-xs text-slate-400 font-medium">(${dayGroup.items.reduce((a,b)=>a+b.sks,0)} SKS)</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${dayGroup.items.map(item => renderCard(dayGroup.day, item)).join('')}
            </div>
          </div>
        `).join('<div class="h-4"></div>');
      }
    }

    function renderCard(day, item) {
      const status = getClassStatus(day, item.timeStart, item.timeEnd);

      return `
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 border border-slate-200/80 dark:border-slate-800/80 shadow-xs hover:shadow-md hover:border-indigo-300 dark:hover:border-indigo-800 transition-all duration-200 group relative flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between gap-2 mb-3">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 rounded-xl text-xs font-mono font-bold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700 flex items-center gap-1">
                  <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  ${item.time}
                </span>
                <span class="px-2.5 py-1 rounded-xl text-[11px] font-bold text-white ${item.badgeColor}">
                  ${item.sks} SKS
                </span>
              </div>
              <span class="px-2.5 py-1 rounded-xl text-[10px] font-semibold ${status.color}">
                ${status.label}
              </span>
            </div>

            <h3 class="font-bold text-slate-900 dark:text-white text-base group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors leading-snug mb-3">
              ${item.title}
            </h3>

            <div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 dark:bg-slate-800/50 p-3 rounded-2xl border border-slate-100 dark:border-slate-800/60 mb-3">
              <div>
                <span class="text-slate-400 font-medium block text-[10px]">RUANGAN</span>
                <span class="font-bold text-slate-800 dark:text-slate-200 flex items-center gap-1 mt-0.5">
                  <svg class="w-3.5 h-3.5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                  ${item.room}
                </span>
              </div>
              <div>
                <span class="text-slate-400 font-medium block text-[10px]">KELAS</span>
                <span class="font-bold text-slate-800 dark:text-slate-200 flex items-center gap-1 mt-0.5">
                  <svg class="w-3.5 h-3.5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h10M7 12h10m-8 5h8" />
                  </svg>
                  Kelas ${item.classCode}
                </span>
              </div>
              <div class="col-span-2 pt-1.5 border-t border-slate-200/60 dark:border-slate-700/60">
                <span class="text-slate-400 font-medium block text-[10px]">DOSEN PENGAJAR</span>
                <span class="font-semibold text-slate-700 dark:text-slate-300 mt-0.5 flex items-center gap-1.5 truncate">
                  <svg class="w-3.5 h-3.5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                  </svg>
                  <span class="truncate">${item.lecturer}</span>
                </span>
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between pt-1">
            <span class="text-[11px] font-semibold text-slate-400">
              Kategori: <strong class="text-slate-600 dark:text-slate-300 font-bold">${item.category}</strong>
            </span>
            <button onclick="copyInfo('${item.title}', '${item.room}', '${item.lecturer}')" class="p-2 text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition" title="Salin Info">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
              </svg>
            </button>
          </div>
        </div>
      `;
    }

    function initPWA() {
      const manifestData = {
        name: "Timetable 24 SKS",
        short_name: "Timetable",
        description: "Jadwal Kuliah Mingguan Updated 24 SKS PWA",
        start_url: "./",
        display: "standalone",
        background_color: "#ffffff",
        theme_color: "#4f46e5",
        icons: [
          {
            src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%234f46e5'/><text x='50' y='68' font-size='55' font-weight='bold' text-anchor='middle' fill='white'>24</text></svg>",
            sizes: "192x192 512x512",
            type: "image/svg+xml",
            purpose: "any maskable"
          }
        ]
      };

      const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
      document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));

      if ('serviceWorker' in navigator) {
        const swCode = `
          const CACHE = 'timetable-24sks-v3';
          self.addEventListener('install', e => e.waitUntil(caches.open(CACHE).then(c => c.add('./'))));
          self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
        `;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
      }
    }
  </script>
</body>
</html>
