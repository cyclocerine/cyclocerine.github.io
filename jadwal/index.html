    <style>
        /* --- MERGED CINEMATIC THEME --- */
        :root {
            /* Cinematic Vars */
            --poster-title: 'Playfair Display', serif;
            --poster-body: 'Lato', sans-serif;
            --overlay-color-1: rgba(135, 206, 235, 0.3);
            --overlay-color-2: rgba(255, 182, 193, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-main: #2d3436;

            /* Legacy Mapping */
            --primary-color: #0984e3;
            --secondary-color: transparent;
            --text-color: var(--text-main);
            --border-color: rgba(0, 0, 0, 0.1);
            --card-bg: var(--glass-bg);
            --current-day-bg: rgba(255, 234, 167, 0.8);
            --reminder-dot-color: #e74c3c;
            --today-bg: rgba(129, 236, 236, 0.3);
        }

        body {
            font-family: var(--poster-body);
            color: var(--text-main);
            overflow-x: hidden;
            cursor: none;
            /* Hide default cursor */
            background: none;
            min-height: 100vh;
        }

        /* --- Custom Cursor --- */
        .cursor-outline {
            position: fixed;
            top: 0;
            left: 0;
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background 0.3s;
        }

        .cursor-outline.hovered {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Mobile Cursor Reset */
        @media (hover: none) and (pointer: coarse) {
            .cursor-outline {
                display: none;
            }

            body,
            a,
            button,
            input {
                cursor: auto !important;
            }
        }

        /* Desktop Strict Cursor */
        a,
        button,
        [role="button"],
        input,
        select,
        textarea {
            cursor: none !important;
        }

        /* --- Background Layers --- */
        #atmosphere {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .cinematic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -3;
            filter: blur(8px);
            transform: scale(1.1);
        }

        .cinematic-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--overlay-color-1) 0%, transparent 50%, var(--overlay-color-2) 100%);
            z-index: -2;
            pointer-events: none;
        }

        /* --- Glass Components --- */
        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            margin-bottom: 2rem;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.25);
        }

        /* --- Typography --- */
        h1,
        h2,
        h3 {
            font-family: var(--poster-title);
        }

        h1 {
            text-align: center;
            color: var(--text-main);
            font-size: 3rem;
            margin-bottom: 1.5rem;
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.5);
        }

        h2 {
            font-size: 1.8rem;
            color: var(--primary-color);
            border-bottom: 2px solid var(--glass-border);
            padding-bottom: 0.5rem;
            margin-top: 0;
        }

        /* --- Layout Utils --- */
        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            position: relative;
            z-index: 10;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 2fr 1fr;
            }
        }

        /* --- Calendar Specifics --- */
        .schedule ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .schedule li {
            background-color: rgba(255, 255, 255, 0.5);
            border-left: 5px solid var(--primary-color);
            margin-bottom: 0.75rem;
            padding: 1rem;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
        }

        .schedule li:hover {
            transform: translateX(5px);
        }

        #today-schedule li {
            background-color: var(--today-bg);
        }

        .button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--poster-body);
        }

        .button:hover {
            background-color: #00cec9;
            transform: scale(1.05);
        }

        /* Calendar Grid */
        #calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 0.5rem;
            text-align: center;
        }

        .day-cell {
            padding: 0.75rem 0;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .day-cell:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        .day-cell.current-day {
            background-color: var(--current-day-bg);
            font-weight: bold;
            border-color: #ff9f43;
        }

        .day-cell.has-reminder::after {
            content: '';
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 6px;
            height: 6px;
            background: var(--reminder-dot-color);
            border-radius: 50%;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s;
            z-index: 10000;
        }

        .modal.show {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
        }

        .modal-list li {
            background-color: #f1f2f6;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            border-radius: 4px;
        }
    </style>
</head>

    <script>
        function initAtmosphere() {
            const container = document.getElementById('atmosphere');
            if (!container) return;
            const particleCount = 20;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('spirit-particle');
                container.appendChild(particle);
                animateParticle(particle);
            }
        }

        function animateParticle(el) {
            const size = Math.random() * 5 + 2;
            el.style.width = `${size}px`;
            el.style.height = `${size}px`;
            el.style.left = `${Math.random() * 100}vw`;
            el.style.top = `${Math.random() * 100}vh`;
            el.style.opacity = Math.random() * 0.5 + 0.1;

            anime({
                targets: el,
                translateY: [{ value: -100, duration: anime.random(2000, 4000) }, { value: 100, duration: anime.random(2000, 4000) }],
                translateX: [{ value: -50, duration: anime.random(2000, 4000) }, { value: 50, duration: anime.random(2000, 4000) }],
                opacity: [{ value: 0.8, duration: 1000 }, { value: 0, duration: 1000 }],
                easing: 'easeInOutSine',
                duration: anime.random(5000, 10000),
                complete: () => animateParticle(el)
            });
        }

        // Custom Cursor Logic
        const cursor = document.querySelector('.cursor-outline');
        if (window.matchMedia("(pointer: fine)").matches) {
            document.addEventListener('mousemove', (e) => {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            });
            // Add listeners to existing interactive elements
            document.querySelectorAll('a, button, .day-cell').forEach(el => {
                el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
                el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
            });
        }

        window.addEventListener('load', initAtmosphere);
    </script>

        document.addEventListener('DOMContentLoaded', () => {

            function renderSchedule(scheduleData, elementId) {
                const container = document.getElementById(elementId);
                container.innerHTML = '';
                for (const day in scheduleData) {
                    const dayList = document.createElement('ul');
                    const dayHeader = document.createElement('h3');
                    dayHeader.textContent = day;
                    container.appendChild(dayHeader);
                    scheduleData[day].forEach(item => {
                        const listItem = document.createElement('li');
                        listItem.innerHTML = `<span class="time">${item.time}</span><span class="details">${item.subject} | ${item.location} | ${item.lecturer}</span>`;
                        dayList.appendChild(listItem);
                    });
                    container.appendChild(dayList);
                }
            }

            function renderTodaySchedule() {
                const today = new Date();
                const todayDateKey = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;

                const container = document.getElementById('today-schedule');
                container.innerHTML = '';
                let hasContent = false;

                const todaySchedule = schedules['if-a'][todayDayName];
                if (todaySchedule) {
                    const ul = document.createElement('ul');

                        const li = document.createElement('li');

                    });
                    container.appendChild(ul);
                    hasContent = true;

                const todayReminders = reminders[todayDateKey];

                    const ul = document.createElement('ul');
                    todayReminders.forEach(reminder => {

                        li.textContent = reminder;
                        ul.appendChild(li);
                    });
                    container.appendChild(ul);
                    hasContent = true;

            const reminderModal = document.getElementById('reminder-modal');
            const modalDate = document.getElementById('modal-date');
            const modalContentList = document.getElementById('modal-content-list');
            const closeButton = document.querySelector('.close-button');
            const reminderDateInput = document.getElementById('reminder-date');
            const reminderTextInput = document.getElementById('reminder-text');
            const addReminderButton = document.getElementById('add-reminder-button');

            let currentDate = new Date();

            function renderCalendar() {
                calendarGrid.innerHTML = '';
                const month = currentDate.getMonth();
                const year = currentDate.getFullYear();

                currentMonthYear.textContent = new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' }).format(currentDate);

                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const daysInMonth = lastDay.getDate();
                const startDayOfWeek = firstDay.getDay();

                const dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
                dayNames.forEach(day => {
                    const dayHeader = document.createElement('div');
                    dayHeader.className = 'day-header';
                    dayHeader.textContent = day;
                    calendarGrid.appendChild(dayHeader);
                });

                for (let i = 0; i < startDayOfWeek; i++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = 'day-cell empty';
                    calendarGrid.appendChild(emptyCell);
                }

                const today = new Date();
                for (let i = 1; i <= daysInMonth; i++) {
                    const dayCell = document.createElement('div');
                    dayCell.className = 'day-cell';
                    dayCell.textContent = i;

                    const dateObj = new Date(year, month, i);
                    const dateKey = `${year}-${month + 1}-${i}`;
                    const dayName = dateObj.toLocaleDateString('id-ID', { weekday: 'long' });

                    const hasSchedule = schedules['if-a'][dayName];
                    const hasReminder = reminders[dateKey] && reminders[dateKey].length > 0;

                    if (hasSchedule || hasReminder) {
                        dayCell.classList.add('has-reminder');
                    }

                    if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                        dayCell.classList.add('current-day');
                    }
                    calendarGrid.appendChild(dayCell);
                }
            }

            prevButton.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });

            nextButton.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });

            addReminderButton.addEventListener('click', () => {
                const date = reminderDateInput.value;
                const text = reminderTextInput.value.trim();

                if (date && text) {
                    const [year, month, day] = date.split('-').map(Number);
                    const dateKey = `${year}-${month}-${day}`;

                    if (!reminders[dateKey]) {
                        reminders[dateKey] = [];
                    }
                    reminders[dateKey].push(text);
                    saveReminders();
                    renderCalendar();
                    renderTodaySchedule();

                    reminderTextInput.value = '';
                    // showModal(`Pengingat berhasil ditambahkan untuk tanggal ${new Date(date).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })}!`);
                } else {
                    // showModal('Silakan pilih tanggal dan masukkan pengingat.');
                }
            });

            calendarGrid.addEventListener('click', (event) => {
                const clickedCell = event.target.closest('.day-cell:not(.empty)');
                if (clickedCell) {
                    const day = parseInt(clickedCell.textContent);
                    const month = currentDate.getMonth();
                    const year = currentDate.getFullYear();
                    const dateObj = new Date(year, month, day);
                    const dateKey = `${year}-${month + 1}-${day}`;
                    const dayName = dateObj.toLocaleDateString('id-ID', { weekday: 'long' });

                    modalDate.textContent = `Kegiatan untuk ${day}, ${dayName} ${new Intl.DateTimeFormat('id-ID', { month: 'long', year: 'numeric' }).format(currentDate)}`;
                    modalContentList.innerHTML = '';

                    const scheduleDataA = schedules['if-a'][dayName];
                    const reminderData = reminders[dateKey];

                    let hasContent = false;

                    if (scheduleDataA) {
                        const scheduleTitle = document.createElement('h4');
                        scheduleTitle.className = 'modal-title';
                        scheduleTitle.textContent = 'Jadwal Kuliah IF-A';
                        modalContentList.appendChild(scheduleTitle);

                        const ul = document.createElement('ul');
                        ul.className = 'modal-list';
                        scheduleDataA.forEach(item => {
                            const li = document.createElement('li');
                            li.innerHTML = `<strong>${item.time}</strong><br>${item.subject} | ${item.location} | ${item.lecturer}`;
                            ul.appendChild(li);
                        });
                        modalContentList.appendChild(ul);
                        hasContent = true;
                    }

                    if (reminderData && reminderData.length > 0) {
                        const reminderTitle = document.createElement('h4');
                        reminderTitle.className = 'modal-title';
                        reminderTitle.textContent = 'Pengingat Tambahan';
                        modalContentList.appendChild(reminderTitle);

                        const ul = document.createElement('ul');
                        ul.className = 'modal-list';
                        reminderData.forEach(reminder => {
                            const li = document.createElement('li');
                            li.textContent = reminder;
                            ul.appendChild(li);
                        });
                        modalContentList.appendChild(ul);
                        hasContent = true;
                    }

                    if (!hasContent) {
                        const message = document.createElement('p');
                        message.textContent = "Tidak ada kegiatan atau pengingat pada hari ini.";
                        modalContentList.appendChild(message);
                    }

                    reminderModal.classList.add('show');
                }
            });

            closeButton.addEventListener('click', () => {
                reminderModal.classList.remove('show');
            });

            window.addEventListener('click', (event) => {
                if (event.target === reminderModal) {
                    reminderModal.classList.remove('show');
                }
            });

            renderCalendar();
        });
    </script>
</body>

</html>
