<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilitas Cetak Foto</title>
    <style>
        :root {
            --sidebar-width: 250px;
            --canvas-bg: #fff;
            --bleed-color: rgba(255, 0, 0, 0.1);
            --grid-color: rgba(0, 0, 0, 0.1);
            --ruler-color: #555;
            --active-color: dodgerblue;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
            height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background-color: #fff;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar h2 {
            margin-top: 0;
            font-size: 1.2em;
            color: #555;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: 0.9em;
            color: #666;
            font-weight: 500;
        }

        .control-group input[type="file"],
        .control-group select,
        .control-group input[type="text"],
        .control-group input[type="color"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #f9f9f9;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #007bff;
            color: #fff;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            overflow: auto; /* Mengaktifkan scroll pada konten utama */
        }
        
        .canvas-wrapper {
            flex-shrink: 0; /* Mencegah wrapper menyusut */
        }
        
        .canvas-container {
            position: relative;
            background-color: #dcdde1;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }
        
        #canvas {
            position: relative;
            background-color: var(--canvas-bg);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px dashed #aaa;
        }

        .photo {
            position: absolute;
            cursor: move;
            user-select: none;
            outline: 2px solid transparent;
            transition: outline 0.1s;
            transform-origin: center center;
            box-sizing: border-box;
        }
        
        .photo.selected {
            outline-color: var(--active-color);
            z-index: 100;
        }

        .photo img {
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Memungkinkan klik melewati ke div induk */
        }
        
        .photo .resize-handle {
            width: 14px;
            height: 14px;
            background-color: var(--active-color);
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            pointer-events: auto;
        }
        
        .photo .resize-handle.bottom-right {
            bottom: -7px;
            right: -7px;
            cursor: nwse-resize;
        }
        
        .photo .rotate-handle {
            width: 20px;
            height: 20px;
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            cursor: grab;
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2em;
        }
        
        .photo .rotate-handle::before {
            content: '⟳';
            color: var(--active-color);
            text-shadow: 0 0 2px #fff;
        }

        .ruler {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.5);
            border: 1px solid #ccc;
            font-size: 10px;
            color: var(--ruler-color);
            user-select: none;
            z-index: 10;
        }
        
        .ruler.horizontal {
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
        }

        .ruler.vertical {
            top: 0;
            left: 0;
            height: 100%;
            width: 20px;
        }

        .ruler .mark {
            position: absolute;
            background-color: var(--ruler-color);
            display: block;
        }
        
        .ruler.horizontal .mark {
            top: 15px;
            width: 1px;
            height: 5px;
        }

        .ruler.vertical .mark {
            left: 15px;
            height: 1px;
            width: 5px;
        }

        .ruler .mark.major {
            height: 10px;
        }

        .ruler .label {
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 0.8em;
        }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: 5;
        }

        .bleed-area {
            position: absolute;
            border: 1px dashed var(--bleed-color);
            box-sizing: border-box;
            pointer-events: none;
        }

        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
        }
        .modal textarea {
            width: 100%;
            height: 200px;
            resize: none;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            font-family: monospace;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Utilitas Cetak Foto</h2>
        
        <div class="control-group">
            <label for="paper-size">Ukuran Kertas:</label>
            <select id="paper-size">
                <option value="A4">A4 (210 x 297 mm)</option>
                <option value="A3">A3 (297 x 420 mm)</option>
                <option value="Letter">Letter (8.5 x 11 in)</option>
                <option value="Custom">Custom</option>
            </select>
        </div>

        <div class="control-group" id="custom-size-controls" style="display:none;">
            <label for="custom-width">Lebar (px):</label>
            <input type="text" id="custom-width" value="800">
            <label for="custom-height">Tinggi (px):</label>
            <input type="text" id="custom-height" value="1131">
        </div>

        <div class="control-group">
            <label for="image-upload">Upload Foto:</label>
            <input type="file" id="image-upload" accept="image/*" multiple>
        </div>

        <div class="control-group">
            <label for="background-color">Warna Background:</label>
            <input type="color" id="background-color" value="#ffffff">
            <label><input type="checkbox" id="transparent-bg-toggle"> Transparan</label>
        </div>

        <div class="control-group">
            <label for="margin-top">Margin (atas/bawah):</label>
            <input type="text" id="margin-y" value="20">
            <label for="margin-left">Margin (kiri/kanan):</label>
            <input type="text" id="margin-x" value="20">
        </div>

        <div class="control-group">
            <label for="bleed-size">Bleed (mm):</label>
            <input type="text" id="bleed-size" value="3">
        </div>
        
        <div class="control-group">
            <label><input type="checkbox" id="grid-toggle" checked> Tampilkan Grid</label>
            <label><input type="checkbox" id="ruler-toggle" checked> Tampilkan Penggaris</label>
        </div>

        <div class="button-group">
            <button id="bring-front-btn">Bawa ke Depan</button>
            <button id="send-back-btn">Kirim ke Belakang</button>
            <button id="rotate-90">Putar 90°</button>
            <button id="duplicate-btn">Duplikat (Ctrl+D)</button>
            <button id="undo-btn" disabled>Undo (Ctrl+Z)</button>
            <button id="redo-btn" disabled>Redo (Ctrl+Y)</button>
        </div>

        <div class="button-group">
            <button id="print-btn">Print</button>
            <button id="pdf-btn">Simpan sebagai PDF</button>
            <button id="export-png-btn">Ekspor PNG</button>
            <button id="export-jpg-btn">Ekspor JPG</button>
            <button id="export-layout-btn">Ekspor Layout</button>
            <button id="import-layout-btn">Impor Layout</button>
        </div>

    </div>
    
    <div class="main-content">
        <div class="canvas-wrapper">
            <div class="canvas-container">
                <div id="ruler-horizontal" class="ruler horizontal"></div>
                <div id="ruler-vertical" class="ruler vertical"></div>
                <div id="grid-overlay" class="grid-overlay"></div>
                <div id="bleed-area" class="bleed-area"></div>
                <div id="canvas"></div>
            </div>
        </div>
    </div>
    
    <!-- Modal untuk Impor Layout -->
    <div id="import-modal" class="modal">
        <h3>Impor Layout dari JSON</h3>
        <p>Tempel JSON layout di bawah ini:</p>
        <textarea id="import-textarea"></textarea>
        <div class="modal-buttons">
            <button id="import-cancel-btn">Batal</button>
            <button id="import-confirm-btn">Impor</button>
        </div>
    </div>

    <!-- Pengecualian: Library eksternal untuk fungsionalitas ekspor yang kompleks. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        const canvas = document.getElementById('canvas');
        const container = document.querySelector('.canvas-container');
        const paperSizeSelect = document.getElementById('paper-size');
        const customSizeControls = document.getElementById('custom-size-controls');
        const customWidthInput = document.getElementById('custom-width');
        const customHeightInput = document.getElementById('custom-height');
        const imageUpload = document.getElementById('image-upload');
        const backgroundColorInput = document.getElementById('background-color');
        const transparentBgToggle = document.getElementById('transparent-bg-toggle');
        const marginYInput = document.getElementById('margin-y');
        const marginXInput = document.getElementById('margin-x');
        const bleedSizeInput = document.getElementById('bleed-size');
        const gridToggle = document.getElementById('grid-toggle');
        const rulerToggle = document.getElementById('ruler-toggle');
        const rotate90Btn = document.getElementById('rotate-90');
        const printBtn = document.getElementById('print-btn');
        const pdfBtn = document.getElementById('pdf-btn');
        const exportPngBtn = document.getElementById('export-png-btn');
        const exportJpgBtn = document.getElementById('export-jpg-btn');
        const undoBtn = document.getElementById('undo-btn');
        const redoBtn = document.getElementById('redo-btn');
        const bringFrontBtn = document.getElementById('bring-front-btn');
        const sendBackBtn = document.getElementById('send-back-btn');
        const duplicateBtn = document.getElementById('duplicate-btn');
        const exportLayoutBtn = document.getElementById('export-layout-btn');
        const importLayoutBtn = document.getElementById('import-layout-btn');
        const importModal = document.getElementById('import-modal');
        const importTextarea = document.getElementById('import-textarea');
        const importCancelBtn = document.getElementById('import-cancel-btn');
        const importConfirmBtn = document.getElementById('import-confirm-btn');
        
        let selectedPhoto = null;
        let isDragging = false;
        let isResizing = false;
        let isRotating = false;
        let startX = 0;
        let startY = 0;
        let initialPhotoX = 0; // Tambahan: Simpan posisi X awal foto saat drag dimulai
        let initialPhotoY = 0; // Tambahan: Simpan posisi Y awal foto saat drag dimulai
        let history = [];
        let historyIndex = -1;
        let minZIndex = 1;
        let maxZIndex = 1;

        const UNITS = {
            mm: 3.7795275591, // 1 mm = 3.7795275591 px pada 96 DPI
            inch: 96,        // 1 inci = 96 px
        };

        const paperSizes = {
            'A4': { width: 210, height: 297, unit: 'mm' },
            'A3': { width: 297, height: 420, unit: 'mm' },
            'Letter': { width: 8.5, height: 11, unit: 'inch' },
            'Custom': { width: 800, height: 1131, unit: 'px' }
        };

        function convertToPx(value, unit) {
            return value * UNITS[unit];
        }

        function updateCanvasSize() {
            const size = paperSizeSelect.value;
            const sizeData = paperSizes[size];
            let widthPx, heightPx;

            if (size === 'Custom') {
                widthPx = parseFloat(customWidthInput.value);
                heightPx = parseFloat(customHeightInput.value);
            } else {
                widthPx = convertToPx(sizeData.width, sizeData.unit);
                heightPx = convertToPx(sizeData.height, sizeData.unit);
            }

            canvas.style.width = `${widthPx}px`;
            canvas.style.height = `${heightPx}px`;
            
            updateBleedArea();
            updateRulers();
        }

        function updateBleedArea() {
            const bleedPx = parseFloat(bleedSizeInput.value) * UNITS.mm;
            const canvasWidth = canvas.offsetWidth;
            const canvasHeight = canvas.offsetHeight;
            
            const bleedArea = document.getElementById('bleed-area');
            if (bleedPx > 0) {
                bleedArea.style.display = 'block';
                bleedArea.style.top = `-${bleedPx}px`;
                bleedArea.style.left = `-${bleedPx}px`;
                bleedArea.style.width = `${canvasWidth + bleedPx * 2}px`;
                bleedArea.style.height = `${canvasHeight + bleedPx * 2}px`;
                bleedArea.style.border = `1px dashed var(--bleed-color)`;
            } else {
                bleedArea.style.display = 'none';
            }
        }

        function updateRulers() {
            const horizontalRuler = document.getElementById('ruler-horizontal');
            const verticalRuler = document.getElementById('ruler-vertical');
            horizontalRuler.innerHTML = '';
            verticalRuler.innerHTML = '';

            if (rulerToggle.checked) {
                const pxToCm = 10 * UNITS.mm;
                
                // Penggaris Horizontal
                for (let i = 0; i < canvas.offsetWidth; i += pxToCm) {
                    const mark = document.createElement('span');
                    mark.className = 'mark';
                    if (i % (10 * pxToCm) === 0) mark.className += ' major';
                    mark.style.left = `${i}px`;
                    
                    const label = document.createElement('span');
                    label.className = 'label';
                    label.innerText = `${Math.round(i / pxToCm * 10)}cm`;
                    label.style.left = `${i + 2}px`;

                    horizontalRuler.appendChild(mark);
                    horizontalRuler.appendChild(label);
                }
                
                // Penggaris Vertikal
                for (let i = 0; i < canvas.offsetHeight; i += pxToCm) {
                    const mark = document.createElement('span');
                    mark.className = 'mark';
                    if (i % (10 * pxToCm) === 0) mark.className += ' major';
                    mark.style.top = `${i}px`;

                    const label = document.createElement('span');
                    label.className = 'label';
                    label.innerText = `${Math.round(i / pxToCm * 10)}cm`;
                    label.style.top = `${i + 2}px`;
                    
                    verticalRuler.appendChild(mark);
                    verticalRuler.appendChild(label);
                }

                horizontalRuler.style.display = 'block';
                verticalRuler.style.display = 'block';
            } else {
                horizontalRuler.style.display = 'none';
                verticalRuler.style.display = 'none';
            }
        }

        function saveState() {
            localStorage.setItem('canvasState', JSON.stringify(getCanvasState()));
        }

        function updateHistory(action, state) {
            history = history.slice(0, historyIndex + 1);
            history.push({ action, state: JSON.stringify(state) });
            historyIndex++;
            updateUndoRedoButtons();
            saveState();
        }

        function updateUndoRedoButtons() {
            undoBtn.disabled = historyIndex <= 0;
            redoBtn.disabled = historyIndex >= history.length - 1;
        }

        function getCanvasState() {
            const photos = Array.from(canvas.children).map(photo => {
                return {
                    id: photo.id,
                    src: photo.dataset.originalSrc,
                    width: photo.offsetWidth,
                    height: photo.offsetHeight,
                    x: parseFloat(photo.dataset.x),
                    y: parseFloat(photo.dataset.y),
                    angle: parseFloat(photo.dataset.angle),
                    aspectRatio: parseFloat(photo.dataset.aspectRatio),
                    zIndex: parseInt(photo.style.zIndex) || 1,
                };
            });
            return photos;
        }

        function restoreCanvasState(state) {
            canvas.innerHTML = '';
            const photos = JSON.parse(state);
            maxZIndex = 1;
            minZIndex = 1;
            photos.forEach(photoState => {
                const photoDiv = createPhotoElement(photoState.src, photoState.aspectRatio);
                photoDiv.id = photoState.id;
                photoDiv.style.width = `${photoState.width}px`;
                photoDiv.style.height = `${photoState.height}px`;
                photoDiv.style.transform = `translate(${photoState.x}px, ${photoState.y}px) rotate(${photoState.angle}deg)`;
                photoDiv.style.zIndex = photoState.zIndex;
                photoDiv.dataset.x = photoState.x;
                photoDiv.dataset.y = photoState.y;
                photoDiv.dataset.angle = photoState.angle;

                canvas.appendChild(photoDiv);
                if (photoState.zIndex > maxZIndex) {
                    maxZIndex = photoState.zIndex;
                }
                if (photoState.zIndex < minZIndex) {
                    minZIndex = photoState.zIndex;
                }
            });
            saveState();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                restoreCanvasState(history[historyIndex].state);
                updateUndoRedoButtons();
                deselectPhoto();
            }
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                restoreCanvasState(history[historyIndex].state);
                updateUndoRedoButtons();
                deselectPhoto();
            }
        }

        function deselectPhoto() {
            if (selectedPhoto) {
                selectedPhoto.classList.remove('selected');
                selectedPhoto = null;
            }
        }

        function createPhotoElement(src, aspectRatio, zIndex = maxZIndex + 1) {
            const photoDiv = document.createElement('div');
            photoDiv.className = 'photo';
            photoDiv.id = `photo-${Date.now()}`;
            
            photoDiv.dataset.originalSrc = src;
            photoDiv.dataset.aspectRatio = aspectRatio;
            photoDiv.dataset.x = '0';
            photoDiv.dataset.y = '0';
            photoDiv.dataset.angle = '0';
            photoDiv.style.zIndex = zIndex;

            const img = new Image();
            img.src = src;
            photoDiv.appendChild(img);

            const resizeHandle = document.createElement('div');
            resizeHandle.className = 'resize-handle bottom-right';
            photoDiv.appendChild(resizeHandle);
            
            const rotateHandle = document.createElement('div');
            rotateHandle.className = 'rotate-handle';
            photoDiv.appendChild(rotateHandle);
            
            photoDiv.addEventListener('click', e => {
                e.stopPropagation();
                deselectPhoto();
                selectedPhoto = photoDiv;
                selectedPhoto.classList.add('selected');
            });

            return photoDiv;
        }

        function applyTransform(element) {
            const x = parseFloat(element.dataset.x);
            const y = parseFloat(element.dataset.y);
            const angle = parseFloat(element.dataset.angle);
            element.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg)`;
        }

        function handleDrag(e) {
            if (!selectedPhoto || !isDragging) return;
            
            // Perbaikan: Gunakan posisi awal foto + delta kursor untuk menghindari bug "lompat"
            let newX = initialPhotoX + (e.clientX - startX);
            let newY = initialPhotoY + (e.clientY - startY);
            
            // Snap-to-grid if Shift is held down
            const gridSize = 20;
            if (e.shiftKey) {
                newX = Math.round(newX / gridSize) * gridSize;
                newY = Math.round(newY / gridSize) * gridSize;
            }

            // Snap-to-center
            const canvasRect = canvas.getBoundingClientRect();
            const photoRect = selectedPhoto.getBoundingClientRect();
            const canvasCenterX = canvasRect.width / 2;
            const canvasCenterY = canvasRect.height / 2;
            const snapThreshold = 5;
            
            const photoCurrentX = newX + photoRect.width / 2;
            const photoCurrentY = newY + photoRect.height / 2;

            if (Math.abs(photoCurrentX - canvasCenterX) < snapThreshold) {
                newX = canvasCenterX - photoRect.width / 2;
            }
            if (Math.abs(photoCurrentY - canvasCenterY) < snapThreshold) {
                newY = canvasCenterY - photoRect.height / 2;
            }

            selectedPhoto.dataset.x = newX;
            selectedPhoto.dataset.y = newY;
            applyTransform(selectedPhoto);
        }

        function handleResize(e) {
            if (!selectedPhoto || !isResizing) return;
            const rect = selectedPhoto.getBoundingClientRect();
            const aspectRatio = parseFloat(selectedPhoto.dataset.aspectRatio);
            
            const newWidth = e.clientX - rect.left;
            let newHeight = newWidth / aspectRatio;
            
            selectedPhoto.style.width = `${newWidth}px`;
            selectedPhoto.style.height = `${newHeight}px`;
        }

        function handleRotate(e) {
            if (!selectedPhoto || !isRotating) return;
            const rect = selectedPhoto.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * 180 / Math.PI + 90;
            selectedPhoto.dataset.angle = angle;
            applyTransform(selectedPhoto);
        }

        document.addEventListener('mousedown', e => {
            if (!e.target.closest('#canvas')) {
                deselectPhoto();
                return;
            }
            if (e.target.className.includes('resize-handle')) {
                isResizing = true;
                e.preventDefault();
            } else if (e.target.className.includes('rotate-handle')) {
                isRotating = true;
                e.preventDefault();
            } else if (e.target.className.includes('photo')) {
                isDragging = true;
                deselectPhoto();
                selectedPhoto = e.target;
                selectedPhoto.classList.add('selected');
                
                // Simpan posisi awal kursor DAN posisi foto
                startX = e.clientX;
                startY = e.clientY;
                initialPhotoX = parseFloat(selectedPhoto.dataset.x);
                initialPhotoY = parseFloat(selectedPhoto.dataset.y);

                e.preventDefault();
            }
        });

        document.addEventListener('mousemove', e => {
            if (isDragging) {
                handleDrag(e);
            } else if (isResizing) {
                handleResize(e);
            } else if (isRotating) {
                handleRotate(e);
            }
        });

        document.addEventListener('mouseup', () => {
            if (isDragging || isResizing || isRotating) {
                updateHistory('update', getCanvasState());
            }
            isDragging = false;
            isResizing = false;
            isRotating = false;
        });
        
        document.addEventListener('click', e => {
            if (e.target.id === 'canvas' || e.target.className === 'canvas-container') {
                deselectPhoto();
            }
        });

        document.addEventListener('keydown', e => {
            if (selectedPhoto) {
                const step = 10;
                let moved = false;
                const currentX = parseFloat(selectedPhoto.dataset.x);
                const currentY = parseFloat(selectedPhoto.dataset.y);
                const currentAngle = parseFloat(selectedPhoto.dataset.angle);

                switch (e.key) {
                    case 'Delete':
                        selectedPhoto.remove();
                        selectedPhoto = null;
                        updateHistory('delete', getCanvasState());
                        moved = true;
                        break;
                    case 'ArrowUp':
                        selectedPhoto.dataset.y = currentY - step;
                        moved = true;
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                        selectedPhoto.dataset.y = currentY + step;
                        moved = true;
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                        selectedPhoto.dataset.x = currentX - step;
                        moved = true;
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                        selectedPhoto.dataset.x = currentX + step;
                        moved = true;
                        e.preventDefault();
                        break;
                }
                
                if (moved) {
                    applyTransform(selectedPhoto);
                    updateHistory('move', getCanvasState());
                }
            }

            if (e.ctrlKey || e.metaKey) { // Handle both Ctrl (Windows/Linux) and Cmd (Mac)
                if (e.key === 'z' || e.key === 'Z') {
                    undo();
                    e.preventDefault();
                } else if (e.key === 'y' || e.key === 'Y') {
                    redo();
                    e.preventDefault();
                } else if (e.key === 'd' || e.key === 'D') {
                    if (selectedPhoto) {
                        const state = getCanvasState().find(p => p.id === selectedPhoto.id);
                        const newPhotoDiv = createPhotoElement(state.src, state.aspectRatio, maxZIndex + 1);
                        newPhotoDiv.style.width = `${state.width}px`;
                        newPhotoDiv.style.height = `${state.height}px`;
                        newPhotoDiv.dataset.x = parseFloat(state.x) + 20;
                        newPhotoDiv.dataset.y = parseFloat(state.y) + 20;
                        newPhotoDiv.dataset.angle = parseFloat(state.angle);
                        applyTransform(newPhotoDiv);
                        canvas.appendChild(newPhotoDiv);
                        updateHistory('duplicate', getCanvasState());
                    }
                    e.preventDefault();
                }
            }
        });
        
        // --- Event Listeners ---
        paperSizeSelect.addEventListener('change', (e) => {
            if (e.target.value === 'Custom') {
                customSizeControls.style.display = 'flex';
            } else {
                customSizeControls.style.display = 'none';
            }
            updateCanvasSize();
        });

        customWidthInput.addEventListener('change', updateCanvasSize);
        customHeightInput.addEventListener('change', updateCanvasSize);

        imageUpload.addEventListener('change', (e) => {
            Array.from(e.target.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const aspectRatio = img.naturalWidth / img.naturalHeight;
                        const photoDiv = createPhotoElement(event.target.result, aspectRatio);
                        
                        // Set initial size and position
                        photoDiv.style.width = '200px';
                        photoDiv.style.height = `${200 / aspectRatio}px`;
                        photoDiv.dataset.x = '50';
                        photoDiv.dataset.y = '50';
                        applyTransform(photoDiv);
                        
                        canvas.appendChild(photoDiv);
                        updateHistory('add', getCanvasState());
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        });
        
        backgroundColorInput.addEventListener('input', (e) => {
            canvas.style.backgroundColor = e.target.value;
            transparentBgToggle.checked = false;
        });
        
        transparentBgToggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                canvas.style.backgroundColor = 'transparent';
            } else {
                canvas.style.backgroundColor = backgroundColorInput.value;
            }
        });
        
        marginYInput.addEventListener('change', updateBleedArea);
        marginXInput.addEventListener('change', updateBleedArea);
        bleedSizeInput.addEventListener('change', updateBleedArea);
        
        gridToggle.addEventListener('change', (e) => {
            document.getElementById('grid-overlay').style.display = e.target.checked ? 'block' : 'none';
        });

        rulerToggle.addEventListener('change', updateRulers);
        
        rotate90Btn.addEventListener('click', () => {
            if (selectedPhoto) {
                let currentAngle = parseFloat(selectedPhoto.dataset.angle);
                let newAngle = currentAngle + 90;
                if (newAngle >= 360) newAngle -= 360;
                selectedPhoto.dataset.angle = newAngle;
                applyTransform(selectedPhoto);
                updateHistory('rotate', getCanvasState());
            }
        });

        bringFrontBtn.addEventListener('click', () => {
            if (selectedPhoto) {
                maxZIndex++;
                selectedPhoto.style.zIndex = maxZIndex;
                updateHistory('bring-front', getCanvasState());
            }
        });

        sendBackBtn.addEventListener('click', () => {
            if (selectedPhoto) {
                minZIndex--;
                selectedPhoto.style.zIndex = minZIndex;
                updateHistory('send-back', getCanvasState());
            }
        });
        
        undoBtn.addEventListener('click', undo);
        redoBtn.addEventListener('click', redo);

        exportLayoutBtn.addEventListener('click', () => {
            const layoutState = JSON.stringify(getCanvasState(), null, 2);
            const blob = new Blob([layoutState], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'layout.json';
            link.click();
            URL.revokeObjectURL(url);
        });

        importLayoutBtn.addEventListener('click', () => {
            importModal.style.display = 'block';
        });

        importCancelBtn.addEventListener('click', () => {
            importModal.style.display = 'none';
        });

        importConfirmBtn.addEventListener('click', () => {
            try {
                const importedState = JSON.parse(importTextarea.value);
                restoreCanvasState(JSON.stringify(importedState));
                updateHistory('import', getCanvasState());
                importModal.style.display = 'none';
            } catch (error) {
                alert('JSON tidak valid. Pastikan formatnya benar.');
            }
        });

        // --- Fungsi Ekspor ---
        async function captureCanvas() {
            deselectPhoto();
            const bleedArea = document.getElementById('bleed-area');
            const gridOverlay = document.getElementById('grid-overlay');
            const rulerHorizontal = document.getElementById('ruler-horizontal');
            const rulerVertical = document.getElementById('ruler-vertical');
            
            const originalBleedDisplay = bleedArea.style.display;
            const originalGridDisplay = gridOverlay.style.display;
            const originalRulerHDisplay = rulerHorizontal.style.display;
            const originalRulerVDisplay = rulerVertical.style.display;
            
            // Hide all overlays before capturing
            bleedArea.style.display = 'none';
            gridOverlay.style.display = 'none';
            rulerHorizontal.style.display = 'none';
            rulerVertical.style.display = 'none';

            const canvasElement = await html2canvas(canvas, {
                useCORS: true,
                backgroundColor: transparentBgToggle.checked ? null : backgroundColorInput.value,
            });
            
            // Restore original display settings
            bleedArea.style.display = originalBleedDisplay;
            gridOverlay.style.display = originalGridDisplay;
            rulerHorizontal.style.display = originalRulerHDisplay;
            rulerVertical.style.display = originalRulerVDisplay;

            return canvasElement;
        }

        async function exportImage(format) {
            let canvasImage = await captureCanvas();
            
            // Handle JPG with transparent background
            if (format === 'jpg' && transparentBgToggle.checked) {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvasImage.width;
                tempCanvas.height = canvasImage.height;
                const ctx = tempCanvas.getContext('2d');
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                ctx.drawImage(canvasImage, 0, 0);
                canvasImage = tempCanvas;
            }

            const dataURL = canvasImage.toDataURL(`image/${format === 'jpg' ? 'jpeg' : format}`);
            
            const link = document.createElement('a');
            link.download = `print_layout.${format}`;
            link.href = dataURL;
            link.click();
        }

        async function exportPDF() {
            const canvasImage = await captureCanvas();
            const dataURL = canvasImage.toDataURL('image/png');
            
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({
                orientation: canvas.offsetWidth > canvas.offsetHeight ? 'landscape' : 'portrait',
                unit: 'px',
                format: [canvas.offsetWidth, canvas.offsetHeight]
            });
            
            doc.addImage(dataURL, 'PNG', 0, 0, canvas.offsetWidth, canvas.offsetHeight);
            doc.save('print_layout.pdf');
        }

        async function printLayout() {
            const canvasImage = await captureCanvas();
            const dataURL = canvasImage.toDataURL('image/png');
            
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                    <head>
                        <title>Print Layout</title>
                        <style>
                            @page {
                                size: ${paperSizeSelect.value.toLowerCase()};
                                margin: 0;
                            }
                            body { margin: 0; padding: 0; }
                            img {
                                width: 100%;
                                height: auto;
                                display: block;
                            }
                        </style>
                    </head>
                    <body>
                        <img src="${dataURL}">
                    </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.focus();
            printWindow.print();
        }

        exportPngBtn.addEventListener('click', () => exportImage('png'));
        exportJpgBtn.addEventListener('click', () => exportImage('jpg'));
        pdfBtn.addEventListener('click', exportPDF);
        printBtn.addEventListener('click', printLayout);

        // --- Inisialisasi ---
        function initialize() {
            updateCanvasSize();
            const savedState = localStorage.getItem('canvasState');
            if (savedState) {
                restoreCanvasState(savedState);
            } else {
                updateHistory('init', getCanvasState());
            }
        }

        initialize();

    </script>
</body>
</html>
