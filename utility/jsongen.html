<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Pick JSON Generator</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font for a clean look */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Slate 50 - Very light gray/off-white */
            color: #374151; /* Dark gray text */
            line-height: 1.6;
        }
        /* Custom styles for button hover effects */
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header Section -->
    <header class="bg-slate-900 text-white p-6 shadow-lg rounded-b-lg">
        <div class="container mx-auto text-center">
            <h1 class="text-4xl font-bold mb-2">JSON Generator Rekomendasi Saham</h1>
            <p class="text-lg opacity-90">Alat untuk membuat data JSON rekomendasi saham Anda.</p>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="container mx-auto px-4 py-8 flex-grow grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- Input Form Section -->
        <section class="bg-white p-8 rounded-xl shadow-md">
            <h2 class="text-3xl font-semibold text-gray-800 mb-6 text-center">Input Detail Saham</h2>
            <form id="stock-form" class="space-y-4">
                <div>
                    <label for="ticker" class="block text-sm font-medium text-gray-700">Ticker Saham (e.g., BBCA)</label>
                    <input type="text" id="ticker" name="ticker" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="nama" class="block text-sm font-medium text-gray-700">Nama Perusahaan (e.g., Bank Central Asia Tbk.)</label>
                    <input type="text" id="nama" name="nama" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="hargaSaatIni" class="block text-sm font-medium text-gray-700">Harga Saat Ini (e.g., Rp 9.500)</label>
                    <input type="text" id="hargaSaatIni" name="hargaSaatIni" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="hargaEntry" class="block text-sm font-medium text-gray-700">Harga Entry (e.g., Rp 9.300 - Rp 9.450)</label>
                    <input type="text" id="hargaEntry" name="hargaEntry" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="sl" class="block text-sm font-medium text-gray-700">Stop Loss (SL) (e.g., Rp 9.100)</label>
                    <input type="text" id="sl" name="sl" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="tp" class="block text-sm font-medium text-gray-700">Take Profit (TP) (e.g., Rp 9.800 - Rp 10.000)</label>
                    <input type="text" id="tp" name="tp" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required>
                </div>
                <div>
                    <label for="alasan" class="block text-sm font-medium text-gray-700">Alasan Rekomendasi</label>
                    <div class="flex items-end space-x-2">
                        <textarea id="alasan" name="alasan" rows="3" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" required></textarea>
                        <button type="button" id="generate-alasan-btn" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-3 rounded-md shadow-md transition-all duration-200 text-sm flex-shrink-0">
                            ✨ Generate
                        </button>
                    </div>
                    <p id="generate-alasan-status" class="text-xs text-gray-500 mt-1 hidden"></p>
                </div>
                <div>
                    <label for="status" class="block text-sm font-medium text-gray-700">Status Rekomendasi</label>
                    <select id="status" name="status" class="mt-1 block w-full px-3 py-2 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        <option value="strong_buy">Strong Buy</option>
                        <option value="buy">Buy</option>
                        <option value="neutral">Neutral</option>
                        <option value="speculative">Speculative</option>
                    </select>
                </div>
                <div class="flex space-x-4">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md shadow-md transition-all duration-200 btn-primary">
                        Tambahkan Saham
                    </button>
                    <button type="button" id="clear-form-btn" class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-md shadow-md transition-all duration-200 btn-secondary">
                        Bersihkan Form
                    </button>
                </div>
            </form>
        </section>

        <!-- JSON Output Section -->
        <section class="bg-white p-8 rounded-xl shadow-md flex flex-col">
            <h2 class="text-3xl font-semibold text-gray-800 mb-6 text-center">Output JSON</h2>
            <textarea id="json-output" class="flex-grow w-full h-64 border border-gray-300 rounded-md p-3 text-sm font-mono bg-gray-50 resize-y" readonly></textarea>
            <div class="mt-4 flex space-x-4">
                <button id="copy-json-btn" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md shadow-md transition-all duration-200 btn-copy">
                    Copy JSON
                </button>
                <button id="clear-all-btn" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md shadow-md transition-all duration-200 btn-secondary">
                    Bersihkan Semua
                </button>
            </div>
            <div id="message-box" class="mt-4 p-3 rounded-md text-sm text-center hidden"></div>
        </section>
    </main>

    <!-- Footer Section -->
    <footer class="bg-slate-900 text-white p-6 text-center mt-8 rounded-t-lg">
        <p class="text-sm">&copy; 2025 Cyclocerine.</p>
        <p class="text-xs mt-1">Kunjungi GitHub saya: <a href="https://github.com/cyclocerine/" target="_blank" class="text-blue-300 hover:underline">github.com/cyclocerine/</a></p>
    </footer>

    <!-- JavaScript for JSON generation -->
    <script>
        const stockForm = document.getElementById('stock-form');
        const jsonOutput = document.getElementById('json-output');
        const copyJsonBtn = document.getElementById('copy-json-btn');
        const clearFormBtn = document.getElementById('clear-form-btn');
        const clearAllBtn = document.getElementById('clear-all-btn');
        const messageBox = document.getElementById('message-box');
        const generateAlasanBtn = document.getElementById('generate-alasan-btn');
        const generateAlasanStatus = document.getElementById('generate-alasan-status');

        let allStocks = []; // Array to hold all stock objects

        // Function to display messages
        function showMessage(message, type = 'info') {
            messageBox.textContent = message;
            messageBox.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800', 'bg-blue-100', 'text-blue-800');
            if (type === 'success') {
                messageBox.classList.add('bg-green-100', 'text-green-800');
            } else if (type === 'error') {
                messageBox.classList.add('bg-red-100', 'text-red-800');
            } else {
                messageBox.classList.add('bg-blue-100', 'text-blue-800');
            }
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 3000); // Hide after 3 seconds
        }

        // Function to update JSON output
        function updateJsonOutput() {
            jsonOutput.value = JSON.stringify(allStocks, null, 4); // Pretty print JSON
        }

        // Handle form submission
        stockForm.addEventListener('submit', (event) => {
            event.preventDefault(); // Prevent default form submission

            const formData = new FormData(stockForm);
            const stock = {};
            for (const [key, value] of formData.entries()) {
                stock[key] = value;
            }

            allStocks.push(stock);
            updateJsonOutput();
            stockForm.reset(); // Clear form after adding
            showMessage('Saham berhasil ditambahkan!', 'success');
        });

        // Handle copy JSON button click
        copyJsonBtn.addEventListener('click', () => {
            if (jsonOutput.value) {
                document.execCommand('copy'); // Use execCommand for clipboard access in iframes
                showMessage('JSON berhasil disalin ke clipboard!', 'success');
            } else {
                showMessage('Tidak ada JSON untuk disalin.', 'info');
            }
        });

        // Handle clear form button click
        clearFormBtn.addEventListener('click', () => {
            stockForm.reset();
            showMessage('Formulir berhasil dibersihkan.', 'info');
        });

        // Handle clear all button click
        clearAllBtn.addEventListener('click', () => {
            allStocks = [];
            updateJsonOutput();
            showMessage('Semua data JSON berhasil dibersihkan.', 'info');
        });

        // Function to generate reason using Gemini API
        generateAlasanBtn.addEventListener('click', async () => {
            const ticker = document.getElementById('ticker').value;
            const status = document.getElementById('status').value;
            const alasanTextarea = document.getElementById('alasan');

            if (!ticker) {
                showMessage('Harap masukkan Ticker Saham terlebih dahulu.', 'error');
                return;
            }

            generateAlasanStatus.textContent = 'Membuat alasan...';
            generateAlasanStatus.classList.remove('hidden');
            generateAlasanBtn.disabled = true; // Disable button during generation

            try {
                const prompt = `Buatkan alasan singkat dan padat (maksimal 50 kata) untuk rekomendasi saham dengan ticker ${ticker.toUpperCase()} dan status ${status.replace('_', ' ')}. Fokus pada potensi investasi atau trading.`;
                let chatHistory = [];
                chatHistory.push({ role: "user", parts: [{ text: prompt }] });
                const payload = { contents: chatHistory };
                const apiKey = "AIzaSyA24p_t-OrtybS1EMo-a12ZUNGDWxYByGs"; // Canvas will provide this API key at runtime
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.candidates && result.candidates.length > 0 &&
                    result.candidates[0].content && result.candidates[0].content.parts &&
                    result.candidates[0].content.parts.length > 0) {
                    const generatedText = result.candidates[0].content.parts[0].text;
                    alasanTextarea.value = generatedText;
                    showMessage('Alasan berhasil dibuat!', 'success');
                } else {
                    showMessage('Gagal membuat alasan. Coba lagi.', 'error');
                    console.error('Gemini API response format unexpected:', result);
                }
            } catch (error) {
                showMessage('Terjadi kesalahan saat menghubungi Gemini API.', 'error');
                console.error('Error calling Gemini API:', error);
            } finally {
                generateAlasanStatus.classList.add('hidden');
                generateAlasanBtn.disabled = false; // Re-enable button
            }
        });

        // Initial update of JSON output (in case allStocks has initial data, though currently empty)
        updateJsonOutput();
    </script>
</body>
</html>
