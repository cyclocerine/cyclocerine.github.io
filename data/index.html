<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Mahasiswa IF 2025</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      font-family: 'Inter', sans-serif;
    }

    body {
      scroll-behavior: smooth;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .glass-sidebar {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar {
      height: calc(100vh - 8rem);
      overflow-y: auto;
    }

    .sidebar::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.5);
      border-radius: 3px;
    }

    .sidebar::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 92, 246, 0.7);
    }

    .student-item {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .student-item:hover {
      background: rgba(139, 92, 246, 0.3);
      transform: translateX(5px);
    }

    .student-item.active {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.4), rgba(168, 85, 247, 0.4));
      border-left: 3px solid #a855f7;
    }

    .btn-nav {
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-nav::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    .btn-nav:hover::before {
      left: 100%;
    }

    .btn-nav:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
    }

    .info-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .info-card:hover {
      transform: translateY(-2px);
      border-color: rgba(139, 92, 246, 0.3);
    }

    .slide-enter {
      animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .counter-badge {
      background: linear-gradient(135deg, #8b5cf6, #a855f7);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4);
      }

      50% {
        box-shadow: 0 0 0 10px rgba(139, 92, 246, 0);
      }
    }

    .search-input {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    .search-input:focus {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
      outline: none;
    }

    @media (max-width: 1024px) {
      .sidebar {
        display: none !important;
      }

      .mobile-list {
        display: block !important;
      }
    }
  </style>
</head>

<body class="text-white">
  <!-- Password Modal -->
  <div id="passwordModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="glass-card rounded-2xl p-8 max-w-md w-full mx-4 text-center">
      <div
        class="w-16 h-16 rounded-2xl bg-gradient-to-br from-violet-500 to-purple-600 flex items-center justify-center mx-auto mb-6 shadow-lg">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
          </path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-white mb-2">Akses Terbatas</h2>
      <p class="text-gray-400 mb-6">Masukkan password untuk melihat data mahasiswa</p>
      <input type="password" id="passwordInput" placeholder="Enter password..."
        class="search-input w-full px-4 py-3 rounded-xl text-white placeholder-gray-400 mb-4 text-center">
      <p id="errorMsg" class="text-red-400 text-sm mb-4 hidden">Password salah!</p>
      <button id="unlockBtn"
        class="btn-nav w-full px-6 py-3 bg-gradient-to-r from-violet-600 to-purple-600 rounded-xl font-medium">
        Unlock
      </button>
      
    </div>
  </div>

  <!-- Main Container (hidden initially) -->
  <div id="mainContainer" class="hidden">

    <div class="container mx-auto px-4 py-8 max-w-7xl">
      <!-- Header -->
      <header class="text-center mb-8">
        <div class="inline-flex items-center gap-3 mb-4">
          <div
            class="w-12 h-12 rounded-xl bg-gradient-to-br from-violet-500 to-purple-600 flex items-center justify-center shadow-lg">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
              </path>
            </svg>
          </div>
          <h1
            class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-violet-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
            Data Mahasiswa IF 2025
          </h1>
        </div>
        <p class="text-gray-400 text-sm md:text-base">Gunakan tombol ← → atau pilih dari daftar</p>
        <div id="counterBadge" class="counter-badge inline-block mt-4 px-4 py-2 rounded-full text-sm font-semibold">
        </div>
      </header>

      <!-- Main Content -->
      <div class="flex flex-col lg:flex-row gap-6">
        <!-- Slide Panel -->
        <div class="flex-1 glass-card rounded-2xl p-6 md:p-8">
          <!-- Search -->
          <div class="mb-6">
            <input type="text" id="searchInput" placeholder="🔍 Cari mahasiswa..."
              class="search-input w-full px-4 py-3 rounded-xl text-white placeholder-gray-400">
          </div>

          <!-- Slide Content -->
          <div id="slideContent" class="slide-enter min-h-[300px]"></div>

          <!-- Navigation -->
          <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-8 pt-6 border-t border-white/10">
            <button id="prevBtn"
              class="btn-nav w-full sm:w-auto px-6 py-3 bg-white/10 rounded-xl hover:bg-white/20 font-medium flex items-center justify-center gap-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
              </svg>
              Sebelumnya
            </button>
            <div id="pageIndicator" class="text-gray-400 text-sm font-medium"></div>
            <button id="nextBtn"
              class="btn-nav w-full sm:w-auto px-6 py-3 bg-gradient-to-r from-violet-600 to-purple-600 rounded-xl font-medium flex items-center justify-center gap-2">
              Selanjutnya
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar w-full lg:w-80 glass-sidebar rounded-2xl p-4 hidden lg:block">
          <h2 class="font-semibold text-lg mb-4 text-white/90 flex items-center gap-2">
            <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z">
              </path>
            </svg>
            Daftar Mahasiswa
          </h2>
          <ul id="studentList" class="space-y-1"></ul>
        </div>

        <!-- Mobile Select -->
        <div class="mobile-list w-full glass-card rounded-2xl p-4 lg:hidden hidden">
          <label for="mobileSelect" class="block font-medium mb-2 text-white/90">Pilih Mahasiswa:</label>
          <select id="mobileSelect"
            class="w-full p-3 bg-white/10 border border-white/20 rounded-xl text-white focus:outline-none focus:border-purple-500"></select>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <footer class="text-center mt-8 text-gray-500 text-sm">
      <p>© 2025 cyclocerine</p>
    </footer>
  </div>

        if (!decryptedStr) {
          throw new Error('Decryption failed');
        }

        // Parse JSON
        students = eval(decryptedStr);
        filteredStudents = [...students];

        // Success!
        isUnlocked = true;
        sessionStorage.setItem('dataif_auth', 'true');
        sessionStorage.setItem('dataif_pwd', password);

        document.getElementById('passwordModal').classList.add('hidden');
        document.getElementById('mainContainer').classList.remove('hidden');

        renderSlide(currentIndex);
        renderList();
        document.querySelector('.mobile-list').classList.remove('hidden');

        return true;
      } catch (e) {
        console.error('Decryption error:', e);
        return false;
      }
    }

    document.getElementById('unlockBtn').addEventListener('click', () => {
      const password = document.getElementById('passwordInput').value;
      if (!unlockData(password)) {
        document.getElementById('errorMsg').classList.remove('hidden');
        document.getElementById('passwordInput').classList.add('border-red-500');
      }
    });

    document.getElementById('passwordInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('unlockBtn').click();
      }
    });

    document.getElementById('passwordInput').addEventListener('input', () => {
      document.getElementById('errorMsg').classList.add('hidden');
      document.getElementById('passwordInput').classList.remove('border-red-500');
    });

    // Update counter badge
    function updateCounter() {
      document.getElementById('counterBadge').textContent = `${currentIndex + 1} / ${filteredStudents.length} Mahasiswa`;
      document.getElementById('pageIndicator').textContent = `${currentIndex + 1} dari ${filteredStudents.length}`;
    }

    function renderSlide(index) {
      const s = filteredStudents[index];
      if (!s) return;

      const html = `
        <div class="slide-enter">
          <div class="flex items-center gap-4 mb-6">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-violet-500 to-purple-600 flex items-center justify-center text-2xl font-bold shadow-lg">
              ${s.nama.charAt(0)}
            </div>
            <div>
              <h2 class="text-2xl md:text-3xl font-bold text-white">${s.nama}</h2>
              <p class="text-gray-400 text-sm">Mahasiswa Informatika 2025</p>
            </div>
          </div>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="info-card rounded-xl p-4">
              <div class="flex items-center gap-3 mb-2">
                <div class="w-8 h-8 rounded-lg bg-pink-500/20 flex items-center justify-center">
                  <svg class="w-4 h-4 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                  </svg>
                </div>
                <span class="text-gray-400 text-sm">Tempat, Tanggal Lahir</span>
              </div>
              <p class="text-white font-medium pl-11">${s.ttl || '—'}</p>
            </div>

            <div class="info-card rounded-xl p-4">
              <div class="flex items-center gap-3 mb-2">
                <div class="w-8 h-8 rounded-lg bg-blue-500/20 flex items-center justify-center">
                  <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  </svg>
                </div>
                <span class="text-gray-400 text-sm">Instagram</span>
              </div>
              <p class="text-white font-medium pl-11">${s.ig && s.ig !== '-' ? `<a href="https://instagram.com/${s.ig}" target="_blank" class="text-purple-400 hover:text-purple-300 transition">@${s.ig}</a>` : '—'}</p>
            </div>

            <div class="info-card rounded-xl p-4">
              <div class="flex items-center gap-3 mb-2">
                <div class="w-8 h-8 rounded-lg bg-green-500/20 flex items-center justify-center">
                  <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                  </svg>
                </div>
                <span class="text-gray-400 text-sm">Hobi</span>
              </div>
              <p class="text-white font-medium pl-11">${s.hobi || '—'}</p>
            </div>

            <div class="info-card rounded-xl p-4">
              <div class="flex items-center gap-3 mb-2">
                <div class="w-8 h-8 rounded-lg bg-red-500/20 flex items-center justify-center">
                  <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
                  </svg>
                </div>
                <span class="text-gray-400 text-sm">Golongan Darah</span>
              </div>
              <p class="text-white font-medium pl-11">${s.darah || '—'}</p>
            </div>
          </div>

          <div class="info-card rounded-xl p-4 mt-4">
            <div class="flex items-center gap-3 mb-2">
              <div class="w-8 h-8 rounded-lg bg-yellow-500/20 flex items-center justify-center">
                <svg class="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
              </div>
              <span class="text-gray-400 text-sm">Alamat</span>
            </div>
            <p class="text-white font-medium pl-11">${s.alamat || '—'}</p>
          </div>
        </div>
      `;
      document.getElementById('slideContent').innerHTML = html;
      updateCounter();
    }

    function renderList() {
      const list = document.getElementById('studentList');
      const select = document.getElementById('mobileSelect');
      list.innerHTML = '';
      select.innerHTML = '';

      filteredStudents.forEach((s, i) => {
        const li = document.createElement('li');
        li.className = `student-item cursor-pointer p-3 rounded-xl text-sm text-white/80 ${i === currentIndex ? 'active font-semibold text-white' : ''}`;
        li.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-500/30 to-purple-600/30 flex items-center justify-center text-xs font-bold text-purple-300">
              ${s.nama.charAt(0)}
            </div>
            <span class="truncate">${s.nama}</span>
          </div>
        `;
        li.onclick = () => { currentIndex = i; renderSlide(i); renderList(); };
        list.appendChild(li);

        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = s.nama;
        select.appendChild(opt);
      });
      select.value = currentIndex;
    }

    // Search functionality
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      filteredStudents = students.filter(s =>
        s.nama.toLowerCase().includes(query) ||
        s.alamat.toLowerCase().includes(query) ||
        s.hobi.toLowerCase().includes(query)
      );
      currentIndex = 0;
      renderSlide(currentIndex);
      renderList();
    });

    // Event listeners
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide(currentIndex);
        renderList();
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentIndex < filteredStudents.length - 1) {
        currentIndex++;
        renderSlide(currentIndex);
        renderList();
      }
    });

    document.getElementById('mobileSelect').addEventListener('change', e => {
      currentIndex = parseInt(e.target.value);
      renderSlide(currentIndex);
      renderList();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' && currentIndex > 0) {
        currentIndex--;
        renderSlide(currentIndex);
        renderList();
      } else if (e.key === 'ArrowRight' && currentIndex < filteredStudents.length - 1) {
        currentIndex++;
        renderSlide(currentIndex);
        renderList();
      }
    });

    // Note: renderSlide and renderList are called from unlockData() after successful authentication
  </script>
</body>

</html>
