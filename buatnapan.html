<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقة البلاغة - iqq</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Amiri', serif;
            background: linear-gradient(135deg, #064e3b 0%, #14532d 100%);
        }
        .arabic-q {
            font-family: 'Amiri', serif;
            direction: rtl;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }
        .math-container {
            overflow-x: auto;
            scrollbar-width: none;
        }
        .math-container::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="app" class="max-w-lg w-full glass-card rounded-[2.5rem] overflow-hidden transition-all duration-500">
        <!-- Progress Bar -->
        <div id="quiz-header" class="hidden bg-emerald-800 p-6 text-white">
            <div class="flex justify-between items-center mb-4">
                <span class="text-[10px] font-black tracking-widest uppercase opacity-80">اختبار البلاغة</span>
                <span id="question-counter" class="text-xs font-bold bg-black/20 px-3 py-1 rounded-full">1/10</span>
            </div>
            <div class="w-full bg-black/10 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-white h-full transition-all duration-500 rounded-full" style="width: 10%"></div>
            </div>
        </div>

        <div id="content" class="p-8 md:p-12">
            <!-- Welcome Screen -->
            <div id="welcome-screen">
                <div class="text-center">
                    <div class="bg-emerald-50 w-24 h-24 rounded-[2rem] flex items-center justify-center mx-auto mb-6 shadow-inner">
                        <span class="text-5xl text-emerald-700 font-bold arabic-q">ض</span>
                    </div>
                    <h1 class="text-2xl font-extrabold text-gray-900 mb-3">Tantangan Balaghah!</h1>
                    <p class="text-gray-500 mb-8 text-sm leading-relaxed text-center">
                        Kerjain soal Balaghah dalam Bahasa Arab. <br>
                        Minimal <span class="text-emerald-700 font-bold text-lg">Skor 90</span> buat dapet THR DANA Kaget iqq!
                    </p>
                    <button onclick="startQuiz()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-5 rounded-2xl transition-all shadow-xl shadow-emerald-200 active:scale-95 uppercase tracking-widest text-sm">
                        Mulai Sekarang
                    </button>
                </div>
            </div>

            <!-- Quiz Screen -->
            <div id="quiz-screen" class="hidden">
                <div id="question-text" class="arabic-q text-2xl md:text-3xl font-bold text-gray-800 mb-10 text-center min-h-[140px] flex flex-col justify-center leading-loose">
                </div>
                <div id="options-container" class="space-y-4">
                </div>
            </div>

            <!-- Result Screen: LULUS -->
            <div id="success-screen" class="hidden text-center">
                <div class="mb-6 text-7xl animate-bounce">🎁</div>
                <h2 class="text-3xl font-black text-gray-900 mb-2 italic">MUMTAZ!</h2>
                <p id="final-score-success" class="text-emerald-700 font-bold mb-8 text-xl"></p>
                <div class="p-1 bg-gradient-to-r from-emerald-400 to-teal-600 rounded-[2.2rem] shadow-lg">
                    <div class="bg-white rounded-[2rem] p-6">
                        <p class="text-xs text-gray-400 mb-4 font-semibold uppercase tracking-tighter">Sikat selagi masih ada 💸</p>
                        <a href="https://link.dana.id/danakaget?c=s6zxuva4a&r=cAYRNY&orderId=20260321101214955915010300166601670163476" 
                           target="_blank"
                           class="flex items-center justify-center gap-3 w-full bg-[#008ce3] hover:bg-[#0076c0] text-white font-black py-4 rounded-2xl transition-all active:scale-95 text-center shadow-lg">
                            <span>KLAIM DANA KAGET</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Result Screen: GAGAL -->
            <div id="fail-screen" class="hidden text-center">
                <div class="mb-6 text-7xl">✍️</div>
                <h2 class="text-2xl font-black text-gray-900 mb-2">Kurang Beruntung!</h2>
                <p id="final-score-fail" class="text-red-500 font-bold mb-4 text-xl"></p>
                <p class="text-gray-500 mb-8 text-sm italic">Minimal skor 90 ya broo buat cairin THR. Murojaah lagi kosa katanya!</p>
                <button onclick="location.reload()" class="w-full bg-gray-900 text-white font-bold py-4 rounded-2xl transition-all active:scale-95">
                    Coba Lagi iqq!
                </button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "ما هو التشبيه الذي حُذِفَت منه الأداة ووجه الشبه؟",
                options: ["التشبيه المرسل", "التشبيه البليغ", "التشبيه المجمل", "التشبيه المؤكد"],
                correct: 1
            },
            {
                q: "قولنا: \"العلم نور\" يعتبر مثالاً لـ:",
                options: ["الاستعارة المكنية", "التشبيه البليغ", "المجاز المرسل", "الكناية"],
                correct: 1
            },
            {
                q: "الاستعارة التي حُذِفَ منها \"المشبه به\" ورُمِز له بشيء من لوازمه هي:",
                options: ["الاستعارة التصريحية", "الاستعارة المكنية", "الاستعارة الأصلية", "الاستعارة التبعية"],
                correct: 1
            },
            {
                q: "ما هو العلم الذي يدرس المحسنات اللفظية والمعنوية؟",
                options: ["علم البيان", "علم المعاني", "علم البديع", "علم العروض"],
                correct: 2
            },
            {
                q: "الجمع بين الكلمة وضدها في الكلام يسمى:",
                options: ["الجناس", "السجع", "الطباق", "التورية"],
                correct: 2
            },
            {
                q: "قوله تعالى: \"ويوم تقوم الساعة يقسم المجرمون ما لبثوا غير ساعة\" فيه:",
                options: ["جناس تام", "جناس ناقص", "سجع", "طباق"],
                correct: 0
            },
            {
                q: "توافق الفاصلتين في الحرف الأخير يسمى:",
                options: ["الجناس", "الطباق", "السجع", "المقابلة"],
                correct: 2
            },
            {
                q: "اللفظ الذي أريد به لازم معناه مع جواز إرادة المعنى الأصلي هو:",
                options: ["الاستعارة", "الكناية", "التشبيه", "المجاز"],
                correct: 1
            },
            {
                q: "قولنا: \"فلان كثير الرماد\" كناية عن:",
                options: ["الشجاعة", "الخوف", "الكرم", "الفقر"],
                correct: 2
            },
            {
                q: "أي من الآتي يعتبر من أركان التشبيه؟",
                options: ["المشبه", "المشبه به", "أداة التشبيه", "جميع ما سبق"],
                correct: 3
            }
        ];

        let currentIndex = 0;
        let score = 0;

        function startQuiz() {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('quiz-header').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const data = questions[currentIndex];
            document.getElementById('question-counter').innerText = `${currentIndex + 1}/10`;
            document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
            
            const qText = document.getElementById('question-text');
            qText.innerHTML = data.q;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            data.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "arabic-q w-full text-right p-5 rounded-2xl border-2 border-gray-100 hover:border-emerald-700 hover:bg-emerald-50 transition-all font-bold text-gray-700 flex justify-between items-center group active:scale-[0.98]";
                btn.innerHTML = `
                    <span class="text-xl">${opt}</span>
                    <div class="w-6 h-6 rounded-full border-2 border-gray-200 group-hover:border-emerald-700 flex items-center justify-center shrink-0 mr-4">
                        <div class="w-3 h-3 rounded-full bg-emerald-700 scale-0 group-hover:scale-100 transition-transform"></div>
                    </div>
                `;
                btn.onclick = () => next(i);
                container.appendChild(btn);
            });
        }

        function next(idx) {
            if (idx === questions[currentIndex].correct) score += 10;
            
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                showQuestion();
            } else {
                finish();
            }
        }

        function finish() {
            document.getElementById('quiz-header').classList.add('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            
            if (score >= 90) {
                document.getElementById('success-screen').classList.remove('hidden');
                document.getElementById('final-score-success').innerText = `Skor Akhir: ${score}`;
            } else {
                document.getElementById('fail-screen').classList.remove('hidden');
                document.getElementById('final-score-fail').innerText = `Skor Akhir: ${score}`;
            }
        }
    </script>
</body>
</html>
