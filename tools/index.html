<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Pro Ultra - Security Suite</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.2s ease; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .vault-card {
            background: var(--card);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; justify-content: center; gap: 12px; }
        .header p { color: var(--text-muted); margin-top: 8px; font-size: 0.95rem; }

        /* Tabs Navigation */
        .tabs {
            display: flex;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        /* Form Inputs */
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; }
        
        textarea, input {
            width: 100%;
            padding: 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            background: #fff;
        }

        textarea:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        textarea { height: 120px; resize: vertical; }

        .password-wrapper { position: relative; }
        .toggle-password {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-muted); cursor: pointer;
        }

        /* File Drop Zone */
        .file-zone {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background: #fbfcfe;
            position: relative;
        }

        .file-zone:hover { border-color: var(--primary); background: #f5f3ff; }
        .file-zone i { color: var(--primary); margin-bottom: 12px; }
        .file-info { margin-top: 15px; font-size: 0.85rem; color: var(--primary); font-weight: 600; display: none; }

        /* Buttons Grid */
        .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer;
            font-size: 0.95rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; transform: translateY(-2px); }
        .btn-secondary { background: #f1f5f9; color: var(--text-muted); width: 100%; margin-top: 12px; }

        /* Result Visualization */
        .result-area {
            margin-top: 30px;
            padding: 24px;
            background: #f8fafc;
            border-radius: 20px;
            border: 1px solid var(--border);
            display: none;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .result-title { font-weight: 700; font-size: 0.9rem; color: var(--text-main); }

        #output {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.8rem;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
            padding: 12px;
            background: white;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .file-result-card {
            display: flex;
            align-items: center;
            gap: 15px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .action-btns { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .action-btn {
            padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border);
            background: white; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 8px;
            font-weight: 600; color: var(--text-main);
        }
        .action-btn:hover { border-color: var(--primary); color: var(--primary); background: #f5f3ff; }
        .action-btn.download-trigger { background: var(--primary); color: white; border: none; }
        .action-btn.download-trigger:hover { background: var(--primary-hover); color: white; }

        /* Toast UI */
        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #1e293b; color: white; padding: 14px 28px; border-radius: 50px;
            font-weight: 600; z-index: 1000; opacity: 0; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="vault-card">
    <div class="header">
        <h1><i data-lucide="shield-check"></i> Vault Pro Ultra</h1>
        <p>Solusi enkripsi AES-256 untuk teks dan file Anda.</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tabText" onclick="switchTab('text')"><i data-lucide="type"></i> Teks</button>
        <button class="tab-btn" id="tabFile" onclick="switchTab('file')"><i data-lucide="file"></i> File</button>
    </div>

    <!-- Master Key Section -->
    <div class="form-group">
        <label>Kunci Rahasia (Wajib Diingat!)</label>
        <div class="password-wrapper">
            <input type="password" id="masterKey" placeholder="Masukkan password pengunci...">
            <button class="toggle-password" onclick="togglePass()">
                <i data-lucide="eye" id="eyeIcon"></i>
            </button>
        </div>
    </div>

    <!-- Text Module -->
    <div id="textSection">
        <div class="form-group">
            <label>Pesan / Ciphertext</label>
            <textarea id="textInput" placeholder="Tulis pesan rahasia di sini atau tempel kode enkripsi..."></textarea>
        </div>
        <div class="button-grid">
            <button class="btn btn-primary" onclick="processText('encrypt')"><i data-lucide="lock"></i> Enkripsi Teks</button>
            <button class="btn btn-success" onclick="processText('decrypt')"><i data-lucide="unlock"></i> Dekripsi Teks</button>
        </div>
    </div>

    <!-- File Module -->
    <div id="fileSection" class="hidden">
        <label>Unggah File</label>
        <div class="file-zone" onclick="document.getElementById('fileInput').click()" id="dropZone">
            <i data-lucide="upload-cloud" style="width: 48px; height: 48px;"></i>
            <p>Klik atau Taruh file apa saja di sini</p>
            <input type="file" id="fileInput" class="hidden" onchange="handleFileSelect(this)">
            <div id="fileDisplay" class="file-info"></div>
        </div>
        <div class="button-grid">
            <button class="btn btn-primary" onclick="processFile('encrypt')"><i data-lucide="file-lock"></i> Enkripsi File</button>
            <button class="btn btn-success" onclick="processFile('decrypt')"><i data-lucide="file-unlock"></i> Dekripsi File</button>
        </div>
    </div>

    <button class="btn btn-secondary" onclick="resetAll()"><i data-lucide="refresh-cw"></i> Bersihkan Semua</button>

    <!-- Unified Result Area -->
    <div id="resultContainer" class="result-area">
        <div class="result-header">
            <span class="result-title" id="resultLabel">Hasil Pemrosesan:</span>
            <span id="timestamp" style="font-size: 0.7rem; color: var(--text-muted);"></span>
        </div>

        <!-- Text Result View -->
        <div id="textOutputView">
            <div id="output">...</div>
            <div class="action-btns">
                <button class="action-btn" onclick="copyResult()"><i data-lucide="copy"></i> Salin</button>
                <button class="action-btn download-trigger" onclick="downloadTextResult()"><i data-lucide="download"></i> Simpan .txt</button>
            </div>
        </div>

        <!-- File Result View -->
        <div id="fileOutputView" class="hidden">
            <div class="file-result-card">
                <i data-lucide="file-check" style="color: var(--success); width: 32px; height: 32px;"></i>
                <div>
                    <div id="resultFileName" style="font-weight: 700; font-size: 0.9rem;">file_hasil.enc</div>
                    <div id="resultFileSize" style="font-size: 0.75rem; color: var(--text-muted);">0 KB</div>
                </div>
            </div>
            <div class="action-btns">
                <button class="action-btn download-trigger" id="fileDownloadBtn"><i data-lucide="download-cloud"></i> Unduh File Hasil</button>
            </div>
        </div>
    </div>
</div>

<div id="toast">Notifikasi</div>

<script>
    // Inisialisasi Ikon
    lucide.createIcons();
    
    // Konfigurasi Base58 (Alphabet Tanpa Karakter Mirip)
    const ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
    let selectedFile = null;
    let processedFileBlob = null;
    let processedFileName = "";

    // --- Manajemen UI ---
    function switchTab(type) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(type === 'text' ? 'tabText' : 'tabFile').classList.add('active');
        
        if(type === 'text') {
            document.getElementById('textSection').classList.remove('hidden');
            document.getElementById('fileSection').classList.add('hidden');
        } else {
            document.getElementById('textSection').classList.add('hidden');
            document.getElementById('fileSection').classList.remove('hidden');
        }
        document.getElementById('resultContainer').style.display = 'none';
    }

    function togglePass() {
        const input = document.getElementById('masterKey');
        const icon = document.getElementById('eyeIcon');
        input.type = input.type === 'password' ? 'text' : 'password';
        icon.setAttribute('data-lucide', input.type === 'password' ? 'eye' : 'eye-off');
        lucide.createIcons();
    }

    function showToast(msg, error = false) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.background = error ? '#ef4444' : '#1e293b';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    // --- Base58 Engine ---
    function encodeB58(src) {
        if (src.length === 0) return '';
        let digits = [0];
        for (let i = 0; i < src.length; i++) {
            for (let j = 0; j < digits.length; j++) digits[j] <<= 8;
            digits[0] += src[i];
            let carry = 0;
            for (let j = 0; j < digits.length; j++) {
                digits[j] += carry;
                carry = (digits[j] / 58) | 0;
                digits[j] %= 58;
            }
            while (carry) { digits.push(carry % 58); carry = (carry / 58) | 0; }
        }
        for (let i = 0; src[i] === 0 && i < src.length - 1; i++) digits.push(0);
        return digits.reverse().map(d => ALPHABET[d]).join('');
    }

    function decodeB58(src) {
        if (src.length === 0) return new Uint8Array(0);
        let bytes = [0];
        for (let i = 0; i < src.length; i++) {
            let v = ALPHABET.indexOf(src[i]);
            if (v === -1) return null;
            for (let j = 0; j < bytes.length; j++) bytes[j] *= 58;
            bytes[0] += v;
            let carry = 0;
            for (let j = 0; j < bytes.length; j++) {
                bytes[j] += carry;
                carry = bytes[j] >> 8;
                bytes[j] &= 0xff;
            }
            while (carry) { bytes.push(carry & 0xff); carry >>= 8; }
        }
        for (let i = 0; src[i] === '1' && i < src.length - 1; i++) bytes.push(0);
        return new Uint8Array(bytes.reverse());
    }

    // --- Kriptografi Teks ---
    function processText(mode) {
        const data = document.getElementById('textInput').value.trim();
        const key = document.getElementById('masterKey').value;
        const output = document.getElementById('output');
        
        if(!data || !key) return showToast("Lengkapi teks dan password!", true);

        try {
            if(mode === 'encrypt') {
                const enc = CryptoJS.AES.encrypt(data, key).toString();
                const u8 = new Uint8Array(CryptoJS.enc.Base64.parse(enc).words.flatMap(w => [
                    (w >> 24) & 0xff, (w >> 16) & 0xff, (w >> 8) & 0xff, w & 0xff
                ]).slice(0, CryptoJS.enc.Base64.parse(enc).sigBytes));
                output.innerText = encodeB58(u8);
                showToast("Teks berhasil diamankan!");
            } else {
                const u8 = decodeB58(data);
                const wa = CryptoJS.lib.WordArray.create(u8);
                const dec = CryptoJS.AES.decrypt(CryptoJS.enc.Base64.stringify(wa), key).toString(CryptoJS.enc.Utf8);
                if(!dec) throw new Error();
                output.innerText = dec;
                showToast("Teks berhasil dibuka!");
            }
            
            document.getElementById('textOutputView').classList.remove('hidden');
            document.getElementById('fileOutputView').classList.add('hidden');
            document.getElementById('resultContainer').style.display = 'block';
            document.getElementById('timestamp').innerText = new Date().toLocaleTimeString();
        } catch(e) { showToast("Gagal! Password salah atau kode rusak.", true); }
    }

    // --- Kriptografi File ---
    function handleFileSelect(input) {
        if(input.files && input.files[0]) {
            selectedFile = input.files[0];
            const info = document.getElementById('fileDisplay');
            info.innerText = `File: ${selectedFile.name} (${(selectedFile.size/1024).toFixed(1)} KB)`;
            info.style.display = 'block';
        }
    }

    async function processFile(mode) {
        const key = document.getElementById('masterKey').value;
        if(!selectedFile || !key) return showToast("Pilih file dan isi password!", true);

        showToast("Memproses file... harap tunggu.");
        const reader = new FileReader();

        reader.onload = function(e) {
            try {
                let processedContent;
                let targetName = selectedFile.name;

                if(mode === 'encrypt') {
                    const wa = CryptoJS.lib.WordArray.create(e.target.result);
                    processedContent = CryptoJS.AES.encrypt(wa, key).toString();
                    targetName += ".enc";
                } else {
                    const b64 = e.target.result.toString();
                    const dec = CryptoJS.AES.decrypt(b64, key);
                    if(dec.sigBytes <= 0) throw new Error();
                    
                    const u8 = new Uint8Array(dec.sigBytes);
                    for (let i = 0; i < dec.sigBytes; i++) {
                        u8[i] = (dec.words[i >>> 2] >>> (24 - (i % 4) * 8)) & 0xff;
                    }
                    processedContent = u8;
                    targetName = targetName.endsWith(".enc") ? targetName.replace(".enc", "") : "decrypted_" + targetName;
                }

                // Simpan hasil ke Blob untuk diunduh nanti
                processedFileBlob = new Blob([processedContent]);
                processedFileName = targetName;

                // Tampilkan di UI
                document.getElementById('resultFileName').innerText = targetName;
                document.getElementById('resultFileSize').innerText = `${(processedFileBlob.size/1024).toFixed(1)} KB`;
                
                document.getElementById('textOutputView').classList.add('hidden');
                document.getElementById('fileOutputView').classList.remove('hidden');
                document.getElementById('resultContainer').style.display = 'block';
                document.getElementById('timestamp').innerText = new Date().toLocaleTimeString();

                // Setup tombol unduh
                const downloadBtn = document.getElementById('fileDownloadBtn');
                downloadBtn.onclick = () => {
                    const url = URL.createObjectURL(processedFileBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = processedFileName;
                    a.click();
                    URL.revokeObjectURL(url);
                    showToast("File berhasil disimpan!");
                };

                showToast(`Siap! Klik tombol unduh di bawah.`);
            } catch(err) {
                showToast("Gagal! Password salah atau file bukan format .enc.", true);
            }
        };

        if(mode === 'encrypt') reader.readAsArrayBuffer(selectedFile);
        else reader.readAsText(selectedFile);
    }

    // --- Action Helpers ---
    function copyResult() {
        const t = document.getElementById('output').innerText;
        navigator.clipboard.writeText(t);
        showToast("Tersalin ke papan klip!");
    }

    function downloadTextResult() {
        const t = document.getElementById('output').innerText;
        const blob = new Blob([t], {type: "text/plain"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "vault_secret_" + Date.now() + ".txt";
        a.click();
    }

    function resetAll() {
        document.getElementById('textInput').value = "";
        document.getElementById('masterKey').value = "";
        document.getElementById('fileInput').value = "";
        document.getElementById('fileDisplay').style.display = 'none';
        document.getElementById('resultContainer').style.display = 'none';
        selectedFile = null;
        processedFileBlob = null;
        showToast("Semua form telah dibersihkan.");
    }

    // Drag and Drop Logic
    const zone = document.getElementById('dropZone');
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
        zone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); });
    });
    zone.addEventListener('drop', e => {
        const input = document.getElementById('fileInput');
        input.files = e.dataTransfer.files;
        handleFileSelect(input);
    });
</script>

</body>
</html>
