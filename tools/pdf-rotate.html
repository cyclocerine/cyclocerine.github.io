<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotate PDF | PDF Tools</title>
    <meta name="description" content="Rotate PDF pages 90°, 180°, or 270° online for free.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-card: rgba(26, 26, 37, 0.8);
            --accent-primary: #ef4444;
            --accent-secondary: #dc2626;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(239, 68, 68, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at 20% 20%, rgba(239, 68, 68, 0.12) 0%, transparent 50%);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            margin-bottom: 30px;
        }

        .back-link:hover {
            color: var(--accent-primary);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
        }

        .upload-area {
            background: var(--bg-card);
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: var(--accent-primary);
        }

        .upload-area input {
            display: none;
        }

        .controls {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
        }

        .controls.show {
            display: block;
        }

        .file-info {
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .file-info .icon {
            font-size: 1.5rem;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 10px;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .rotation-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .rotation-btn {
            flex: 1;
            min-width: 100px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .rotation-btn span {
            font-size: 1.5rem;
        }

        .rotation-btn:hover,
        .rotation-btn.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .page-select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .page-select option {
            background: var(--bg-primary);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            font-size: 1.125rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: none;
        }

        .btn-primary.show {
            display: block;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .result {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-top: 30px;
            text-align: center;
        }

        .result.show {
            display: block;
        }

        .result h3 {
            margin-bottom: 16px;
            color: var(--accent-primary);
        }

        .btn-download {
            padding: 14px 32px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>
    <div class="container">
        <a href="index.html" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg> Back to Tools</a>
        <header>
            <div class="tool-icon">🔄</div>
            <h1>Rotate PDF</h1>
            <p class="subtitle">Rotate all or specific PDF pages by 90°, 180° or 270°</p>
        </header>
        <div class="upload-area" id="uploadArea">
            <h3>📁 Drop PDF file here or click to upload</h3>
            <p>Select a PDF file to rotate</p>
            <input type="file" id="fileInput" accept=".pdf">
        </div>
        <div class="controls" id="controls">
            <div class="file-info">
                <div class="icon">📄</div>
                <div><strong id="fileName"></strong> - <span id="pageCount"></span></div>
            </div>
            <div class="control-group">
                <label>Rotation Angle</label>
                <div class="rotation-options">
                    <button class="rotation-btn active" data-angle="90"><span>↻</span>90° Right</button>
                    <button class="rotation-btn" data-angle="180"><span>🔄</span>180°</button>
                    <button class="rotation-btn" data-angle="270"><span>↺</span>90° Left</button>
                </div>
            </div>
            <div class="control-group">
                <label>Apply To</label>
                <select class="page-select" id="pageSelect">
                    <option value="all">All Pages</option>
                </select>
            </div>
        </div>
        <button class="btn-primary" id="rotateBtn">Rotate PDF</button>
        <div class="result" id="result">
            <h3>✅ PDF Rotated Successfully!</h3>
            <button class="btn-download" id="downloadBtn">Download Rotated PDF</button>
        </div>
    </div>
    <script>
        const { PDFDocument, degrees } = PDFLib;
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const controls = document.getElementById('controls');
        const fileName = document.getElementById('fileName');
        const pageCount = document.getElementById('pageCount');
        const pageSelect = document.getElementById('pageSelect');
        const rotateBtn = document.getElementById('rotateBtn');
        const result = document.getElementById('result');
        const downloadBtn = document.getElementById('downloadBtn');

        let pdfBytes = null, totalPages = 0, angle = 90, resultBytes = null;

        document.querySelectorAll('.rotation-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.rotation-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                angle = parseInt(btn.dataset.angle);
            });
        });

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', e => e.preventDefault());
        uploadArea.addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

        async function handleFile(file) {
            if (!file || file.type !== 'application/pdf') return;
            pdfBytes = await file.arrayBuffer();
            const pdf = await PDFDocument.load(pdfBytes);
            totalPages = pdf.getPageCount();
            fileName.textContent = file.name;
            pageCount.textContent = `${totalPages} pages`;
            pageSelect.innerHTML = '<option value="all">All Pages</option>';
            for (let i = 1; i <= totalPages; i++) {
                pageSelect.innerHTML += `<option value="${i}">Page ${i} only</option>`;
            }
            controls.classList.add('show');
            rotateBtn.classList.add('show');
            result.classList.remove('show');
        }

        rotateBtn.addEventListener('click', async () => {
            rotateBtn.disabled = true;
            rotateBtn.textContent = 'Processing...';
            try {
                const pdf = await PDFDocument.load(pdfBytes);
                const pages = pdf.getPages();
                const applyTo = pageSelect.value;
                if (applyTo === 'all') {
                    pages.forEach(page => page.setRotation(degrees(page.getRotation().angle + angle)));
                } else {
                    const idx = parseInt(applyTo) - 1;
                    const page = pages[idx];
                    page.setRotation(degrees(page.getRotation().angle + angle));
                }
                resultBytes = await pdf.save();
                result.classList.add('show');
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                rotateBtn.disabled = false;
                rotateBtn.textContent = 'Rotate PDF';
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (!resultBytes) return;
            const blob = new Blob([resultBytes], { type: 'application/pdf' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'rotated.pdf';
            a.click();
        });
    </script>
</body>

</html>
