<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split PDF | PDF Tools</title>
    <meta name="description" content="Split PDF into individual pages or extract specific page ranges online for free.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-card: rgba(26, 26, 37, 0.8);
            --accent-primary: #ef4444;
            --accent-secondary: #dc2626;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(239, 68, 68, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at 20% 20%, rgba(239, 68, 68, 0.12) 0%, transparent 50%);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            margin-bottom: 30px;
        }

        .back-link:hover {
            color: var(--accent-primary);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
        }

        .upload-area {
            background: var(--bg-card);
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: var(--accent-primary);
        }

        .upload-area input {
            display: none;
        }

        .controls {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
        }

        .controls.show {
            display: block;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .file-info .icon {
            font-size: 2rem;
        }

        .file-info .details h3 {
            margin-bottom: 4px;
        }

        .file-info .details p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 10px;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .mode-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .range-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .range-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .help-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            font-size: 1.125rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: none;
        }

        .btn-primary.show {
            display: block;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-top: 30px;
            text-align: center;
        }

        .result.show {
            display: block;
        }

        .result h3 {
            margin-bottom: 16px;
            color: var(--accent-primary);
        }

        .btn-download {
            padding: 14px 32px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>
    <div class="container">
        <a href="index.html" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg> Back to Tools</a>
        <header>
            <div class="tool-icon">✂️</div>
            <h1>Split PDF</h1>
            <p class="subtitle">Extract specific pages or split into individual pages</p>
        </header>
        <div class="upload-area" id="uploadArea">
            <h3>📁 Drop PDF file here or click to upload</h3>
            <p>Select a PDF file to split</p>
            <input type="file" id="fileInput" accept=".pdf">
        </div>
        <div class="controls" id="controls">
            <div class="file-info">
                <div class="icon">📄</div>
                <div class="details">
                    <h3 id="fileName"></h3>
                    <p id="pageCount"></p>
                </div>
            </div>
            <div class="mode-toggle">
                <button class="mode-btn active" data-mode="range">Extract Page Range</button>
                <button class="mode-btn" data-mode="all">Split All Pages</button>
            </div>
            <div id="rangeMode">
                <div class="control-group">
                    <label>Page Range</label>
                    <input type="text" class="range-input" id="pageRange" placeholder="e.g., 1-3, 5, 7-9">
                    <p class="help-text">Enter page numbers or ranges separated by commas. Example: 1-3, 5, 7-9</p>
                </div>
            </div>
        </div>
        <button class="btn-primary" id="splitBtn">Split PDF</button>
        <div class="result" id="result">
            <h3>✅ PDF Split Successfully!</h3>
            <p id="resultInfo"></p>
            <button class="btn-download" id="downloadBtn">Download</button>
        </div>
    </div>
    <script>
        const { PDFDocument } = PDFLib;
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const controls = document.getElementById('controls');
        const fileName = document.getElementById('fileName');
        const pageCount = document.getElementById('pageCount');
        const pageRange = document.getElementById('pageRange');
        const rangeMode = document.getElementById('rangeMode');
        const splitBtn = document.getElementById('splitBtn');
        const result = document.getElementById('result');
        const resultInfo = document.getElementById('resultInfo');
        const downloadBtn = document.getElementById('downloadBtn');

        let pdfBytes = null, totalPages = 0, mode = 'range', resultBlob = null;

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                mode = btn.dataset.mode;
                rangeMode.style.display = mode === 'range' ? 'block' : 'none';
            });
        });

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', e => e.preventDefault());
        uploadArea.addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

        async function handleFile(file) {
            if (!file || file.type !== 'application/pdf') return;
            pdfBytes = await file.arrayBuffer();
            const pdf = await PDFDocument.load(pdfBytes);
            totalPages = pdf.getPageCount();
            fileName.textContent = file.name;
            pageCount.textContent = `${totalPages} pages`;
            pageRange.placeholder = `e.g., 1-${Math.min(3, totalPages)}`;
            controls.classList.add('show');
            splitBtn.classList.add('show');
            result.classList.remove('show');
        }

        function parsePageRange(input, max) {
            const pages = new Set();
            const parts = input.split(',');
            for (let part of parts) {
                part = part.trim();
                if (part.includes('-')) {
                    const [start, end] = part.split('-').map(n => parseInt(n.trim()));
                    for (let i = start; i <= end && i <= max; i++) if (i >= 1) pages.add(i);
                } else {
                    const n = parseInt(part);
                    if (n >= 1 && n <= max) pages.add(n);
                }
            }
            return Array.from(pages).sort((a, b) => a - b);
        }

        splitBtn.addEventListener('click', async () => {
            splitBtn.disabled = true;
            splitBtn.textContent = 'Processing...';

            try {
                const srcPdf = await PDFDocument.load(pdfBytes);
                if (mode === 'range') {
                    if (!pageRange.value.trim()) { alert('Please enter page range'); return; }
                    const pages = parsePageRange(pageRange.value, totalPages);
                    if (pages.length === 0) { alert('Invalid page range'); return; }
                    const newPdf = await PDFDocument.create();
                    const indices = pages.map(p => p - 1);
                    const copiedPages = await newPdf.copyPages(srcPdf, indices);
                    copiedPages.forEach(p => newPdf.addPage(p));
                    const bytes = await newPdf.save();
                    resultBlob = new Blob([bytes], { type: 'application/pdf' });
                    resultInfo.textContent = `Extracted ${pages.length} pages`;
                    downloadBtn.textContent = 'Download PDF';
                    downloadBtn.onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(resultBlob); a.download = 'extracted_pages.pdf'; a.click(); };
                } else {
                    const zip = new JSZip();
                    for (let i = 0; i < totalPages; i++) {
                        const newPdf = await PDFDocument.create();
                        const [page] = await newPdf.copyPages(srcPdf, [i]);
                        newPdf.addPage(page);
                        const bytes = await newPdf.save();
                        zip.file(`page_${i + 1}.pdf`, bytes);
                    }
                    resultBlob = await zip.generateAsync({ type: 'blob' });
                    resultInfo.textContent = `Split into ${totalPages} individual PDF files`;
                    downloadBtn.textContent = 'Download ZIP';
                    downloadBtn.onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(resultBlob); a.download = 'split_pages.zip'; a.click(); };
                }
                result.classList.add('show');
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                splitBtn.disabled = false;
                splitBtn.textContent = 'Split PDF';
            }
        });
    </script>
</body>

</html>
