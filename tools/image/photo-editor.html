<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Editor | Image Tools</title>
    <meta name="description" content="Edit photos with brightness, contrast, saturation and filters online for free.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-card: rgba(26, 26, 37, 0.8);
            --accent-primary: #10b981;
            --accent-secondary: #059669;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(16, 185, 129, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at 20% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 50%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            margin-bottom: 30px;
        }

        .back-link:hover {
            color: var(--accent-primary);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
        }

        .upload-area {
            background: var(--bg-card);
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: var(--accent-primary);
        }

        .upload-area input {
            display: none;
        }

        .editor {
            display: none;
        }

        .editor.show {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 24px;
        }

        @media (max-width: 900px) {
            .editor.show {
                grid-template-columns: 1fr;
            }
        }

        .canvas-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }

        .canvas-panel canvas {
            max-width: 100%;
            max-height: 500px;
            border-radius: 8px;
        }

        .controls-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            max-height: 600px;
            overflow-y: auto;
        }

        .section {
            margin-bottom: 24px;
        }

        .section h3 {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group {
            margin-bottom: 16px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .control-group input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent-primary);
            border-radius: 50%;
            cursor: pointer;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .filter-btn {
            padding: 10px 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-reset {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 500;
        }

        .btn-download {
            flex: 2;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>
    <div class="container">
        <a href="../index.html" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg> Back to Tools</a>
        <header>
            <div class="tool-icon">🎨</div>
            <h1>Photo Editor</h1>
            <p class="subtitle">Adjust brightness, contrast, saturation and apply filters</p>
        </header>
        <div class="upload-area" id="uploadArea">
            <h3>📁 Drop image here or click to upload</h3>
            <p>Supports JPG, PNG, WEBP</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        <div class="editor" id="editor">
            <div class="canvas-panel">
                <canvas id="canvas"></canvas>
            </div>
            <div class="controls-panel">
                <div class="section">
                    <h3>Adjustments</h3>
                    <div class="control-group">
                        <label>Brightness <span id="brightnessVal">0</span></label>
                        <input type="range" id="brightness" min="-100" max="100" value="0">
                    </div>
                    <div class="control-group">
                        <label>Contrast <span id="contrastVal">0</span></label>
                        <input type="range" id="contrast" min="-100" max="100" value="0">
                    </div>
                    <div class="control-group">
                        <label>Saturation <span id="saturationVal">0</span></label>
                        <input type="range" id="saturation" min="-100" max="100" value="0">
                    </div>
                    <div class="control-group">
                        <label>Hue Rotate <span id="hueVal">0°</span></label>
                        <input type="range" id="hue" min="0" max="360" value="0">
                    </div>
                    <div class="control-group">
                        <label>Blur <span id="blurVal">0</span></label>
                        <input type="range" id="blur" min="0" max="20" value="0">
                    </div>
                </div>
                <div class="section">
                    <h3>Filters</h3>
                    <div class="filters">
                        <button class="filter-btn active" data-filter="none">None</button>
                        <button class="filter-btn" data-filter="grayscale">B&W</button>
                        <button class="filter-btn" data-filter="sepia">Sepia</button>
                        <button class="filter-btn" data-filter="invert">Invert</button>
                        <button class="filter-btn" data-filter="vintage">Vintage</button>
                        <button class="filter-btn" data-filter="cold">Cold</button>
                        <button class="filter-btn" data-filter="warm">Warm</button>
                        <button class="filter-btn" data-filter="dramatic">Dramatic</button>
                        <button class="filter-btn" data-filter="fade">Fade</button>
                    </div>
                </div>
                <div class="btn-row">
                    <button class="btn-reset" id="resetBtn">Reset</button>
                    <button class="btn-download" id="downloadBtn">Download</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const editor = document.getElementById('editor');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const brightness = document.getElementById('brightness');
        const contrast = document.getElementById('contrast');
        const saturation = document.getElementById('saturation');
        const hue = document.getElementById('hue');
        const blur = document.getElementById('blur');
        const resetBtn = document.getElementById('resetBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let img = null, currentFilter = 'none';

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', e => e.preventDefault());
        uploadArea.addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            img = new Image();
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                editor.classList.add('show');
                render();
            };
            img.src = URL.createObjectURL(file);
        }

        const sliders = [brightness, contrast, saturation, hue, blur];
        sliders.forEach(s => s.addEventListener('input', () => {
            document.getElementById(s.id + 'Val').textContent = s.id === 'hue' ? s.value + '°' : s.value;
            render();
        }));

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        function render() {
            if (!img) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let filterStr = '';
            filterStr += `brightness(${1 + brightness.value / 100}) `;
            filterStr += `contrast(${1 + contrast.value / 100}) `;
            filterStr += `saturate(${1 + saturation.value / 100}) `;
            filterStr += `hue-rotate(${hue.value}deg) `;
            filterStr += `blur(${blur.value}px) `;

            switch (currentFilter) {
                case 'grayscale': filterStr += 'grayscale(100%) '; break;
                case 'sepia': filterStr += 'sepia(80%) '; break;
                case 'invert': filterStr += 'invert(100%) '; break;
                case 'vintage': filterStr += 'sepia(40%) contrast(90%) brightness(90%) '; break;
                case 'cold': filterStr += 'saturate(80%) hue-rotate(180deg) '; break;
                case 'warm': filterStr += 'saturate(120%) sepia(20%) '; break;
                case 'dramatic': filterStr += 'contrast(150%) saturate(120%) '; break;
                case 'fade': filterStr += 'contrast(80%) brightness(110%) saturate(80%) '; break;
            }

            ctx.filter = filterStr;
            ctx.drawImage(img, 0, 0);
            ctx.filter = 'none';
        }

        resetBtn.addEventListener('click', () => {
            brightness.value = 0; contrast.value = 0; saturation.value = 0; hue.value = 0; blur.value = 0;
            sliders.forEach(s => document.getElementById(s.id + 'Val').textContent = s.id === 'hue' ? '0°' : '0');
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-filter="none"]').classList.add('active');
            currentFilter = 'none';
            render();
        });

        downloadBtn.addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/png');
            a.download = 'edited_photo.png';
            a.click();
        });
    </script>
</body>

</html>
