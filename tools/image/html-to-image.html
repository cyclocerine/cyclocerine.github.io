<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        :root {
            /* Cinematic Base */
            --poster-title: 'Playfair Display', serif;
            --poster-body: 'Lato', sans-serif;
            --overlay-color-1: rgba(135, 206, 235, 0.3);
            --overlay-color-2: rgba(255, 182, 193, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-main: #2d3436;

            /* Remaps */
            --bg-primary: transparent;
            --bg-secondary: transparent;
            --bg-card: var(--glass-bg);
            --accent-primary: #10b981;
            --accent-secondary: #10b981;
            /* Simplify */
            --border-color: var(--glass-border);
            --text-primary: var(--text-main);
            --text-secondary: #555;
            --text-muted: #777;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--poster-body);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background: none;
            cursor: none;
        }

        /* Essential Cinematic Styles */
        .cursor-outline {
            position: fixed;
            top: 0;
            left: 0;
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background 0.3s;
        }

        .cursor-outline.hovered {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
        }

        @media (hover: none) and (pointer: coarse) {
            .cursor-outline {
                display: none;
            }

            body,
            a {
                cursor: auto !important;
            }
        }

        #atmosphere {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .cinematic-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -3;
            filter: blur(8px);
            transform: scale(1.1);
        }

        .cinematic-overlay {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(135deg, var(--overlay-color-1), transparent, var(--overlay-color-2));
            pointer-events: none;
        }

        .bg-gradient {
            display: none;
        }

        /* Typography */
        h1,
        h2,
        h3 {
            font-family: var(--poster-title);
        }

            min-height: 100vh;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at 20% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 50%);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            margin-bottom: 30px;
        }

        .back-link:hover {
            color: var(--accent-primary);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
        }

        .editor {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 30px;
        }

        @media (max-width: 800px) {
            .editor {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
        }

        .panel h3 {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .html-input {
            width: 100%;
            min-height: 300px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: 'Fira Code', monospace;
            font-size: 0.875rem;
            resize: vertical;
        }

        .html-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .preview-container {
            min-height: 300px;
            background: white;
            border-radius: 10px;
            overflow: auto;
        }

        .preview-content {
            padding: 20px;
            color: #333;
        }

        .controls {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
        }

        .control-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: end;
        }

        .control-group {
            flex: 1;
            min-width: 150px;
        }

        .control-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .control-group select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .control-group select option {
            background: var(--bg-primary);
        }

        .btn-primary {
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .result {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }

        .result.show {
            display: block;
        }

        .result img {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .btn-download {
            padding: 14px 32px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div id="atmosphere"></div>
    <img src="../../assets/anime_lake_bg_compressed.webp" class="cinematic-bg" alt="Background">
    <div class="cinematic-overlay"></div>
    <div class="cursor-outline"></div>
    <div class="container" style="position: relative; z-index: 10;">
        <a href="../index.html" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg> Back to Tools</a>
        <header>
            <div class="tool-icon">🌐</div>
            <h1>HTML to Image</h1>
            <p class="subtitle">Convert HTML content to PNG or JPG image</p>
        </header>
        <div class="editor">
            <div class="panel">
                <h3>HTML Input</h3>
                <textarea class="html-input" id="htmlInput" placeholder="Enter your HTML code here..."><div style="padding: 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 16px; text-align: center; font-family: Arial, sans-serif;">
    <h1 style="color: white; margin: 0 0 16px 0; font-size: 32px;">Hello World!</h1>
    <p style="color: rgba(255,255,255,0.9); margin: 0; font-size: 18px;">This is a sample HTML content</p>
</div></textarea>
            </div>
            <div class="panel">
                <h3>Preview</h3>
                <div class="preview-container">
                    <div class="preview-content" id="preview"></div>
                </div>
            </div>
        </div>
        <div class="controls">
            <div class="control-row">
                <div class="control-group">
                    <label>Output Format</label>
                    <select id="format">
                        <option value="png">PNG</option>
                        <option value="jpeg">JPEG</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Scale</label>
                    <select id="scale">
                        <option value="1">1x</option>
                        <option value="2" selected>2x (Retina)</option>
                        <option value="3">3x</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Background</label>
                    <select id="background">
                        <option value="white">White</option>
                        <option value="transparent">Transparent (PNG only)</option>
                        <option value="black">Black</option>
                    </select>
                </div>
                <button class="btn-primary" id="convertBtn">Convert to Image</button>
            </div>
        </div>
        <div class="result" id="result">
            <h3 style="margin-bottom:16px;color:#10b981">✅ Image Generated!</h3>
            <img id="resultImg" src="" alt="Result">
            <div><button class="btn-download" id="downloadBtn">Download Image</button></div>
        </div>
    </div>
    <script>
        const htmlInput = document.getElementById('htmlInput');
        const preview = document.getElementById('preview');
        const format = document.getElementById('format');
        const scale = document.getElementById('scale');
        const background = document.getElementById('background');
        const convertBtn = document.getElementById('convertBtn');
        const result = document.getElementById('result');
        const resultImg = document.getElementById('resultImg');
        const downloadBtn = document.getElementById('downloadBtn');

        let resultDataUrl = null;

        htmlInput.addEventListener('input', updatePreview);
        updatePreview();

        function updatePreview() {
            preview.innerHTML = htmlInput.value;
        }

        convertBtn.addEventListener('click', async () => {
            convertBtn.disabled = true;
            convertBtn.textContent = 'Converting...';

            try {
                const bgColor = background.value === 'transparent' ? null : background.value;
                const canvas = await html2canvas(preview, {
                    scale: parseInt(scale.value),
                    backgroundColor: bgColor,
                    useCORS: true,
                    logging: false
                });

                const fmt = format.value;
                resultDataUrl = canvas.toDataURL(`image/${fmt}`, 0.95);
                resultImg.src = resultDataUrl;
                result.classList.add('show');
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                convertBtn.disabled = false;
                convertBtn.textContent = 'Convert to Image';
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (!resultDataUrl) return;
            const a = document.createElement('a');
            a.href = resultDataUrl;
            a.download = `html_capture.${format.value === 'jpeg' ? 'jpg' : 'png'}`;
            a.click();
        });
    </script>
    <script>
        function initAtmosphere() {
            const container = document.getElementById('atmosphere');
            if (!container) return;
            const particleCount = 20;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('spirit-particle');
                container.appendChild(particle);
                animateParticle(particle);
            }
        }
        function animateParticle(el) {
            const size = Math.random() * 5 + 2;
            el.style.width = ${ size } px;
            el.style.height = ${ size } px;
            el.style.left = ${ Math.random() * 100 } vw;
            el.style.top = ${ Math.random() * 100 } vh;
            el.style.opacity = Math.random() * 0.5 + 0.1;
            anime({
                targets: el, translateY: [{ value: -100, duration: anime.random(2000, 4000) }, { value: 100, duration: anime.random(2000, 4000) }],
                translateX: [{ value: -50, duration: anime.random(2000, 4000) }, { value: 50, duration: anime.random(2000, 4000) }],
                opacity: [{ value: 0.8, duration: 1000 }, { value: 0, duration: 1000 }],
                easing: 'easeInOutSine', duration: anime.random(5000, 10000), complete: () => animateParticle(el)
            });
        }
        const cursor = document.querySelector('.cursor-outline');
        if (window.matchMedia("(pointer: fine)").matches) {
            document.addEventListener('mousemove', (e) => { cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px'; });
            document.querySelectorAll('a, button, input, select, .upload-area').forEach(el => {
                el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
                el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
            });
        }
        window.addEventListener('load', initAtmosphere);
    </script>
