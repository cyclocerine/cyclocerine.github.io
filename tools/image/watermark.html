<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        :root {
            /* Cinematic Base */
            --poster-title: 'Playfair Display', serif;
            --poster-body: 'Lato', sans-serif;
            --overlay-color-1: rgba(135, 206, 235, 0.3);
            --overlay-color-2: rgba(255, 182, 193, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-main: #2d3436;

            /* Remaps */
            --bg-primary: transparent;
            --bg-secondary: transparent;
            --bg-card: var(--glass-bg);
            --accent-primary: #10b981;
            --accent-secondary: #10b981;
            /* Simplify */
            --border-color: var(--glass-border);
            --text-primary: var(--text-main);
            --text-secondary: #555;
            --text-muted: #777;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--poster-body);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background: none;
            cursor: none;
        }

        /* Essential Cinematic Styles */
        .cursor-outline {
            position: fixed;
            top: 0;
            left: 0;
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background 0.3s;
        }

        .cursor-outline.hovered {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
        }

        @media (hover: none) and (pointer: coarse) {
            .cursor-outline {
                display: none;
            }

            body,
            a {
                cursor: auto !important;
            }
        }

        #atmosphere {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .cinematic-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -3;
            filter: blur(8px);
            transform: scale(1.1);
        }

        .cinematic-overlay {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(135deg, var(--overlay-color-1), transparent, var(--overlay-color-2));
            pointer-events: none;
        }

        .bg-gradient {
            display: none;
        }

        /* Typography */
        h1,
        h2,
        h3 {
            font-family: var(--poster-title);
        }

            margin: 0;

        }

            font-family: 'Inter', sans-serif;

            color: var(--text-primary);
            min-height: 100vh;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at 20% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(5, 150, 105, 0.1) 0%, transparent 50%);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            margin-bottom: 30px;
        }

        .back-link:hover {
            color: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 15px 40px -10px rgba(16, 185, 129, 0.4);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
        }

        .upload-area {
            background: var(--bg-card);
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: width 0.3s, height 0.3s, background 0.3s;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: var(--accent-primary);
        }

        .upload-area h3 {
            margin-bottom: 10px;
        }

        .upload-area p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .upload-area input {
            display: none;
        }

        .editor {
            display: none;
        }

        .editor.show {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
        }

        @media (max-width: 800px) {
            .editor.show {
                grid-template-columns: 1fr;
            }
        }

        .preview-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
        }

        .preview-panel canvas {
            max-width: 100%;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }

        .controls-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .control-group input[type="text"],
        .control-group input[type="number"],
        .control-group select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .control-group input[type="color"] {
            width: 50px;
            height: 36px;
            border: none;
            background: none;
            cursor: pointer;
        }

        .control-group input[type="range"] {
            width: 100%;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row>* {
            flex: 1;
        }

        .position-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .pos-btn {
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.75rem;
        }

        .pos-btn:hover,
        .pos-btn.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div id="atmosphere"></div>
    <img src="../../assets/anime_lake_bg_compressed.webp" class="cinematic-bg" alt="Background">
    <div class="cinematic-overlay"></div>
    <div class="cursor-outline"></div>
    <div class="container" style="position: relative; z-index: 10;">
        <a href="../index.html" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg> Back to Tools</a>
        <header>
            <div class="tool-icon">💧</div>
            <h1>Add Watermark</h1>
            <p class="subtitle">Add text or image watermarks with custom position and opacity</p>
        </header>
        <div class="upload-area" id="uploadArea">
            <h3>📁 Drop image here or click to upload</h3>
            <p>Supports JPG, PNG, WEBP</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        <div class="editor" id="editor">
            <div class="preview-panel">
                <canvas id="canvas"></canvas>
            </div>
            <div class="controls-panel">
                <div class="control-group">
                    <label>Watermark Text</label>
                    <input type="text" id="wmText" value="© Watermark" placeholder="Enter watermark text">
                </div>
                <div class="control-group row">
                    <div>
                        <label>Font Size</label>
                        <input type="number" id="fontSize" value="32" min="10" max="200">
                    </div>
                    <div>
                        <label>Color</label>
                        <input type="color" id="fontColor" value="#ffffff">
                    </div>
                </div>
                <div class="control-group">
                    <label>Opacity: <span id="opacityVal">50%</span></label>
                    <input type="range" id="opacity" min="10" max="100" value="50">
                </div>
                <div class="control-group">
                    <label>Position</label>
                    <div class="position-grid">
                        <button class="pos-btn" data-pos="nw">↖ Top Left</button>
                        <button class="pos-btn" data-pos="n">↑ Top</button>
                        <button class="pos-btn" data-pos="ne">↗ Top Right</button>
                        <button class="pos-btn" data-pos="w">← Left</button>
                        <button class="pos-btn active" data-pos="c">● Center</button>
                        <button class="pos-btn" data-pos="e">→ Right</button>
                        <button class="pos-btn" data-pos="sw">↙ Bottom Left</button>
                        <button class="pos-btn" data-pos="s">↓ Bottom</button>
                        <button class="pos-btn" data-pos="se">↘ Bottom Right</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>Rotation</label>
                    <input type="range" id="rotation" min="-45" max="45" value="0">
                </div>
                <button class="btn-primary" id="downloadBtn">Download Image</button>
            </div>
        </div>
    </div>
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const editor = document.getElementById('editor');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const wmText = document.getElementById('wmText');
        const fontSize = document.getElementById('fontSize');
        const fontColor = document.getElementById('fontColor');
        const opacity = document.getElementById('opacity');
        const opacityVal = document.getElementById('opacityVal');
        const rotation = document.getElementById('rotation');
        const downloadBtn = document.getElementById('downloadBtn');

        let img = null, position = 'c';

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', e => e.preventDefault());
        uploadArea.addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

        function handleFile(f) {
            if (!f || !f.type.startsWith('image/')) return;
            img = new Image();
            img.onload = () => {
                canvas.width = img.width; canvas.height = img.height;
                editor.classList.add('show');
                render();
            };
            img.src = URL.createObjectURL(f);
        }

        [wmText, fontSize, fontColor, opacity, rotation].forEach(el => el.addEventListener('input', render));
        opacity.addEventListener('input', () => opacityVal.textContent = opacity.value + '%');

        document.querySelectorAll('.pos-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                position = btn.dataset.pos;
                render();
            });
        });

        function render() {
            if (!img) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);

            const text = wmText.value;
            const size = parseInt(fontSize.value);
            const color = fontColor.value;
            const alpha = parseInt(opacity.value) / 100;
            const rot = parseInt(rotation.value) * Math.PI / 180;

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = `bold ${size}px Inter, sans-serif`;
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const metrics = ctx.measureText(text);
            const tw = metrics.width, th = size;
            const pad = 30;
            let x, y;

            switch (position) {
                case 'nw': x = pad + tw / 2; y = pad + th / 2; break;
                case 'n': x = canvas.width / 2; y = pad + th / 2; break;
                case 'ne': x = canvas.width - pad - tw / 2; y = pad + th / 2; break;
                case 'w': x = pad + tw / 2; y = canvas.height / 2; break;
                case 'c': x = canvas.width / 2; y = canvas.height / 2; break;
                case 'e': x = canvas.width - pad - tw / 2; y = canvas.height / 2; break;
                case 'sw': x = pad + tw / 2; y = canvas.height - pad - th / 2; break;
                case 's': x = canvas.width / 2; y = canvas.height - pad - th / 2; break;
                case 'se': x = canvas.width - pad - tw / 2; y = canvas.height - pad - th / 2; break;
            }

            ctx.translate(x, y);
            ctx.rotate(rot);
            ctx.fillText(text, 0, 0);
            ctx.restore();
        }

        downloadBtn.addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/png');
            a.download = 'watermarked_image.png';
            a.click();
        });
    </script>
    <script>
        function initAtmosphere() {
            const container = document.getElementById('atmosphere');
            if (!container) return;
            const particleCount = 20;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('spirit-particle');
                container.appendChild(particle);
                animateParticle(particle);
            }
        }
        function animateParticle(el) {
            const size = Math.random() * 5 + 2;
            el.style.width = ${ size } px;
            el.style.height = ${ size } px;
            el.style.left = ${ Math.random() * 100 } vw;
            el.style.top = ${ Math.random() * 100 } vh;
            el.style.opacity = Math.random() * 0.5 + 0.1;
            anime({
                targets: el, translateY: [{ value: -100, duration: anime.random(2000, 4000) }, { value: 100, duration: anime.random(2000, 4000) }],
                translateX: [{ value: -50, duration: anime.random(2000, 4000) }, { value: 50, duration: anime.random(2000, 4000) }],
                opacity: [{ value: 0.8, duration: 1000 }, { value: 0, duration: 1000 }],
                easing: 'easeInOutSine', duration: anime.random(5000, 10000), complete: () => animateParticle(el)
            });
        }
        const cursor = document.querySelector('.cursor-outline');
        if (window.matchMedia("(pointer: fine)").matches) {
            document.addEventListener('mousemove', (e) => { cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px'; });
            document.querySelectorAll('a, button, input, select, .upload-area').forEach(el => {
                el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
                el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
            });
        }
        window.addEventListener('load', initAtmosphere);
    </script>
