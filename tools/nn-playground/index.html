<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Playground</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-[#121212] text-gray-200 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="flex items-center justify-between px-6 py-4 border-b border-gray-800 bg-[#1e1e1e]">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-white tracking-tight">NN<span class="text-orange-500">Playground</span>
            </h1>
            <span
                class="px-2 py-0.5 text-xs font-mono bg-gray-800 text-orange-400 rounded border border-orange-500/30">Math-Based</span>
        </div>
        <div>
            <a href="https://github.com/cyclocerine" target="_blank"
                class="text-gray-400 hover:text-white transition-colors">
                <i class="fa-brands fa-github text-xl"></i>
            </a>
        </div>
    </header>

    <!-- Controls Bar -->
    <div class="flex items-center gap-6 px-6 py-3 bg-[#181818] border-b border-gray-800 text-sm overflow-x-auto">

        <!-- Controls Groups -->
        <div class="flex items-center gap-2">
            <label class="text-gray-400">Data:</label>
            <div class="flex bg-gray-800 rounded p-1">
                <button data-type="xor" class="p-1 px-2 rounded hover:bg-gray-700 text-orange-500"><i
                        class="fa-solid fa-shapes"></i></button>
                <button data-type="circle" class="p-1 px-2 rounded hover:bg-gray-700"><i
                        class="fa-regular fa-circle"></i></button>
                <button data-type="spiral" class="p-1 px-2 rounded hover:bg-gray-700"><i
                        class="fa-solid fa-hurricane"></i></button>
            </div>
        </div>

        <div class="h-6 w-px bg-gray-700 mx-2"></div>

        <div class="flex items-center gap-2">
            <label class="text-gray-400">Epoch:</label>
            <span id="epoch-display" class="font-mono text-white w-12">0</span>
        </div>

        <div class="flex items-center gap-2">
            <label class="text-gray-400">Learning Rate:</label>
            <select id="lr-select" class="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs">
                <option value="0.001">0.001</option>
                <option value="0.01">0.01</option>
                <option value="0.03" selected>0.03</option>
                <option value="0.1">0.1</option>
            </select>
        </div>

        <div class="flex items-center gap-2">
            <label class="text-gray-400">Activation:</label>
            <select id="act-select" class="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs">
                <option value="tanh" selected>Tanh</option>
                <option value="relu">ReLU</option>
                <option value="sigmoid">Sigmoid</option>
            </select>
        </div>

        <div class="flex-1"></div>

        <button id="play-btn" class="btn-primary flex items-center gap-2">
            <i class="fa-solid fa-play"></i> Play
        </button>
        <button id="reset-btn" class="btn-secondary" title="Reset Network">
            <i class="fa-solid fa-rotate-left"></i>
        </button>

    </div>

    <!-- Main Content -->
    <main class="flex-1 p-6 overflow-hidden relative grid grid-cols-[200px_180px_1fr_300px] gap-6">

        <!-- col 1: DATA -->
        <div class="flex flex-col gap-4">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Data</h2>

            <div class="glass-panel p-4 flex flex-col gap-4">
                <div class="grid grid-cols-2 gap-2">
                    <button data-type="circle"
                        class="aspect-square rounded border border-gray-700 hover:border-orange-500 flex items-center justify-center bg-gray-800 text-orange-500 transition-colors">
                        <i class="fa-regular fa-circle text-xl"></i>
                    </button>
                    <button data-type="xor"
                        class="aspect-square rounded border border-gray-700 hover:border-orange-500 flex items-center justify-center bg-gray-800 transition-colors">
                        <i class="fa-solid fa-shapes text-xl"></i>
                    </button>
                    <button data-type="spiral"
                        class="aspect-square rounded border border-gray-700 hover:border-orange-500 flex items-center justify-center bg-gray-800 transition-colors">
                        <i class="fa-solid fa-hurricane text-xl"></i>
                    </button>
                    <button data-type="gauss"
                        class="aspect-square rounded border border-gray-700 hover:border-orange-500 flex items-center justify-center bg-gray-800 transition-colors">
                        <i class="fa-solid fa-braille text-xl"></i>
                    </button>
                </div>

                <!-- Sliders -->
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">Ratio: <span id="ratio-val">50%</span></label>
                    <input type="range" min="10" max="90" value="50" class="w-full accent-orange-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">Noise: <span id="noise-val">0</span></label>
                    <input id="noise-slider" type="range" min="0" max="50" value="0" class="w-full accent-orange-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400 mb-1 block">Batch Size: <span id="batch-val">10</span></label>
                    <input id="batch-slider" type="range" min="1" max="30" value="10" class="w-full accent-orange-500">
                </div>

                <button id="regen-data-btn" class="btn-secondary text-xs py-2 w-full mt-2">
                    Regenerate
                </button>
            </div>
        </div>

        <!-- col 2: FEATURES -->
        <div class="flex flex-col gap-4">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Features</h2>

            <div class="glass-panel p-4 flex flex-col gap-2">
                <!-- Feature Checkboxes -->
                <label class="feature-check flex items-center gap-3 p-2 rounded hover:bg-gray-800 cursor-pointer">
                    <input type="checkbox" value="x" checked class="accent-orange-500">
                    <span class="text-sm font-mono">X<sub>1</sub></span>
                </label>
                <label class="feature-check flex items-center gap-3 p-2 rounded hover:bg-gray-800 cursor-pointer">
                    <input type="checkbox" value="y" checked class="accent-orange-500">
                    <span class="text-sm font-mono">X<sub>2</sub></span>
                </label>
                <label class="feature-check flex items-center gap-3 p-2 rounded hover:bg-gray-800 cursor-pointer">
                    <input type="checkbox" value="x2" class="accent-orange-500">
                    <span class="text-sm font-mono">X<sub>1</sub><sup>2</sup></span>
                </label>
                <label class="feature-check flex items-center gap-3 p-2 rounded hover:bg-gray-800 cursor-pointer">
                    <input type="checkbox" value="y2" class="accent-orange-500">
                    <span class="text-sm font-mono">X<sub>2</sub><sup>2</sup></span>
                </label>
                <label class="feature-check flex items-center gap-3 p-2 rounded hover:bg-gray-800 cursor-pointer">
                    <input type="checkbox" value="xy" class="accent-orange-500">
                    <span class="text-sm font-mono">X<sub>1</sub>X<sub>2</sub></span>
                </label>
                <label class="feature-check flex items-center gap-3 p-2 rounded hover:bg-gray-800 cursor-pointer">
                    <input type="checkbox" value="sinx" class="accent-orange-500">
                    <span class="text-sm font-mono">sin(X<sub>1</sub>)</span>
                </label>
                <label class="feature-check flex items-center gap-3 p-2 rounded hover:bg-gray-800 cursor-pointer">
                    <input type="checkbox" value="siny" class="accent-orange-500">
                    <span class="text-sm font-mono">sin(X<sub>2</sub>)</span>
                </label>
            </div>
        </div>

        <!-- col 3: NETWORK -->
        <div class="flex flex-col gap-4 relative">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Network</h2>
                <div class="flex gap-2">
                    <button id="remove-layer"
                        class="text-lg w-8 h-8 rounded bg-gray-800 hover:bg-gray-700 flex items-center justify-center">-</button>
                    <span class="text-sm font-bold flex items-center"><span id="layer-count">2</span>&nbsp;<span
                            class="text-gray-500 text-xs">HIDDEN LAYERS</span></span>
                    <button id="add-layer"
                        class="text-lg w-8 h-8 rounded bg-gray-800 hover:bg-gray-700 flex items-center justify-center">+</button>
                </div>
            </div>

            <div class="viz-container relative bg-[#1a1a1a] flex-1 border-t border-gray-800 mt-2">
                <!-- Layer Controls Overlay -->
                <div id="layer-controls" class="absolute inset-x-0 top-0 h-8 z-10 pointer-events-none">
                    <!-- JS will populate: pointer-events-auto for buttons -->
                </div>
                <svg id="network-svg" width="100%" height="100%" class="absolute inset-0">
                    <!-- Network drawn here -->
                </svg>
            </div>
        </div>

        <!-- col 4: OUTPUT -->
        <div class="flex flex-col gap-4">
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Output</h2>

            <!-- Stats -->
            <div class="glass-panel p-4 mb-2">
                <div class="flex justify-between text-sm mb-1">
                    <span class="text-gray-400">Test Loss</span>
                    <span id="loss-display" class="font-mono text-orange-400">0.0000</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-gray-400">Accuracy</span>
                    <span id="acc-display" class="font-mono text-blue-400">0.00%</span>
                </div>
                <div class="h-16 mt-2 relative w-full bg-black/20 rounded overflow-hidden">
                    <canvas id="loss-graph" class="w-full h-full"></canvas>
                </div>
            </div>

            <!-- Heatmap -->
            <div class="viz-container relative flex-1 min-h-[300px]">
                <canvas id="heatmap-canvas" class="absolute inset-0 w-full h-full"></canvas>

                <!-- Legend -->
                <div
                    class="absolute bottom-2 right-2 flex gap-4 text-[10px] bg-black/60 p-1 px-2 rounded backdrop-blur-sm">
                    <div class="flex items-center gap-1">
                        <div class="w-3 h-3 bg-orange-500 rounded-sm"></div> -1
                    </div>
                    <div class="flex items-center gap-1">
                        <div class="w-3 h-3 bg-blue-500 rounded-sm"></div> +1
                    </div>
                </div>
            </div>

            <div class="text-xs text-gray-500 text-center mt-2">
                <div id="formula-display"></div>
            </div>
        </div>

    </main>

    <!-- App Scripts -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
