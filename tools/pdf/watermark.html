<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermark PDF | PDF Tools</title>
    <meta name="description" content="Add text watermarks to PDF documents online for free.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-card: rgba(26, 26, 37, 0.8);
            --accent-primary: #ef4444;
            --accent-secondary: #dc2626;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(239, 68, 68, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at 20% 20%, rgba(239, 68, 68, 0.12) 0%, transparent 50%);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            margin-bottom: 30px;
        }

        .back-link:hover {
            color: var(--accent-primary);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
        }

        .upload-area {
            background: var(--bg-card);
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: var(--accent-primary);
        }

        .upload-area input {
            display: none;
        }

        .controls {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
        }

        .controls.show {
            display: block;
        }

        .file-info {
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .control-group input[type="text"],
        .control-group input[type="number"],
        .control-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
        }

        .control-group input[type="color"] {
            width: 60px;
            height: 40px;
            border: none;
            cursor: pointer;
        }

        .control-group input[type="range"] {
            width: 100%;
        }

        .row {
            display: flex;
            gap: 16px;
        }

        .row>* {
            flex: 1;
        }

        .position-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .pos-btn {
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.75rem;
        }

        .pos-btn:hover,
        .pos-btn.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            font-size: 1.125rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: none;
        }

        .btn-primary.show {
            display: block;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .result {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-top: 30px;
            text-align: center;
        }

        .result.show {
            display: block;
        }

        .result h3 {
            margin-bottom: 16px;
            color: var(--accent-primary);
        }

        .btn-download {
            padding: 14px 32px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>
    <div class="container">
        <a href="../index.html" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg> Back to Tools</a>
        <header>
            <div class="tool-icon">💧</div>
            <h1>Watermark PDF</h1>
            <p class="subtitle">Add text watermarks to PDF with custom position and style</p>
        </header>
        <div class="upload-area" id="uploadArea">
            <h3>📁 Drop PDF file here or click to upload</h3>
            <p>Select a PDF file to add watermark</p>
            <input type="file" id="fileInput" accept=".pdf">
        </div>
        <div class="controls" id="controls">
            <div class="file-info">
                <span style="font-size:1.5rem">📄</span>
                <div><strong id="fileName"></strong> - <span id="pageCount"></span></div>
            </div>
            <div class="control-group">
                <label>Watermark Text</label>
                <input type="text" id="wmText" value="CONFIDENTIAL" placeholder="Enter watermark text">
            </div>
            <div class="row">
                <div class="control-group">
                    <label>Font Size</label>
                    <input type="number" id="fontSize" value="48" min="12" max="200">
                </div>
                <div class="control-group">
                    <label>Color</label>
                    <input type="color" id="fontColor" value="#ff0000">
                </div>
            </div>
            <div class="control-group">
                <label>Opacity: <span id="opacityVal">30%</span></label>
                <input type="range" id="opacity" min="10" max="100" value="30">
            </div>
            <div class="control-group">
                <label>Rotation: <span id="rotationVal">-45°</span></label>
                <input type="range" id="rotation" min="-90" max="90" value="-45">
            </div>
            <div class="control-group">
                <label>Position</label>
                <div class="position-grid">
                    <button class="pos-btn" data-pos="tl">Top Left</button>
                    <button class="pos-btn" data-pos="tc">Top Center</button>
                    <button class="pos-btn" data-pos="tr">Top Right</button>
                    <button class="pos-btn" data-pos="ml">Middle Left</button>
                    <button class="pos-btn active" data-pos="mc">Center</button>
                    <button class="pos-btn" data-pos="mr">Middle Right</button>
                    <button class="pos-btn" data-pos="bl">Bottom Left</button>
                    <button class="pos-btn" data-pos="bc">Bottom Center</button>
                    <button class="pos-btn" data-pos="br">Bottom Right</button>
                </div>
            </div>
        </div>
        <button class="btn-primary" id="applyBtn">Apply Watermark</button>
        <div class="result" id="result">
            <h3>✅ Watermark Applied!</h3>
            <button class="btn-download" id="downloadBtn">Download PDF</button>
        </div>
    </div>
    <script>
        const { PDFDocument, rgb, degrees } = PDFLib;
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const controls = document.getElementById('controls');
        const fileName = document.getElementById('fileName');
        const pageCount = document.getElementById('pageCount');
        const wmText = document.getElementById('wmText');
        const fontSize = document.getElementById('fontSize');
        const fontColor = document.getElementById('fontColor');
        const opacity = document.getElementById('opacity');
        const opacityVal = document.getElementById('opacityVal');
        const rotation = document.getElementById('rotation');
        const rotationVal = document.getElementById('rotationVal');
        const applyBtn = document.getElementById('applyBtn');
        const result = document.getElementById('result');
        const downloadBtn = document.getElementById('downloadBtn');

        let pdfBytes = null, resultBytes = null, position = 'mc';

        opacity.addEventListener('input', () => opacityVal.textContent = opacity.value + '%');
        rotation.addEventListener('input', () => rotationVal.textContent = rotation.value + '°');

        document.querySelectorAll('.pos-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                position = btn.dataset.pos;
            });
        });

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', e => e.preventDefault());
        uploadArea.addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

        async function handleFile(file) {
            if (!file || file.type !== 'application/pdf') return;
            pdfBytes = await file.arrayBuffer();
            const pdf = await PDFDocument.load(pdfBytes);
            fileName.textContent = file.name;
            pageCount.textContent = `${pdf.getPageCount()} pages`;
            controls.classList.add('show');
            applyBtn.classList.add('show');
            result.classList.remove('show');
        }

        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16) / 255;
            const g = parseInt(hex.slice(3, 5), 16) / 255;
            const b = parseInt(hex.slice(5, 7), 16) / 255;
            return rgb(r, g, b);
        }

        applyBtn.addEventListener('click', async () => {
            applyBtn.disabled = true;
            applyBtn.textContent = 'Processing...';
            try {
                const pdf = await PDFDocument.load(pdfBytes);
                const pages = pdf.getPages();
                const font = await pdf.embedFont(PDFLib.StandardFonts.Helvetica);
                const text = wmText.value || 'WATERMARK';
                const size = parseInt(fontSize.value);
                const color = hexToRgb(fontColor.value);
                const alpha = parseInt(opacity.value) / 100;
                const rot = parseInt(rotation.value);

                for (const page of pages) {
                    const { width, height } = page.getSize();
                    const textWidth = font.widthOfTextAtSize(text, size);
                    let x, y;

                    switch (position) {
                        case 'tl': x = 50; y = height - 50; break;
                        case 'tc': x = width / 2 - textWidth / 2; y = height - 50; break;
                        case 'tr': x = width - textWidth - 50; y = height - 50; break;
                        case 'ml': x = 50; y = height / 2; break;
                        case 'mc': x = width / 2 - textWidth / 2; y = height / 2; break;
                        case 'mr': x = width - textWidth - 50; y = height / 2; break;
                        case 'bl': x = 50; y = 50; break;
                        case 'bc': x = width / 2 - textWidth / 2; y = 50; break;
                        case 'br': x = width - textWidth - 50; y = 50; break;
                    }

                    page.drawText(text, { x, y, size, font, color, opacity: alpha, rotate: degrees(rot) });
                }

                resultBytes = await pdf.save();
                result.classList.add('show');
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                applyBtn.disabled = false;
                applyBtn.textContent = 'Apply Watermark';
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (!resultBytes) return;
            const blob = new Blob([resultBytes], { type: 'application/pdf' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'watermarked.pdf';
            a.click();
        });
    </script>
</body>

</html>
