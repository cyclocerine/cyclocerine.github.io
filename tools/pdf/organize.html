<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organize PDF | PDF Tools</title>
    <meta name="description" content="Reorder and organize PDF pages visually online for free.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-card: rgba(26, 26, 37, 0.8);
            --accent-primary: #ef4444;
            --accent-secondary: #dc2626;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(239, 68, 68, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at 20% 20%, rgba(239, 68, 68, 0.12) 0%, transparent 50%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            margin-bottom: 30px;
        }

        .back-link:hover {
            color: var(--accent-primary);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .tool-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
        }

        .upload-area {
            background: var(--bg-card);
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: var(--accent-primary);
        }

        .upload-area input {
            display: none;
        }

        .toolbar {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 24px;
            margin-bottom: 24px;
        }

        .toolbar.show {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .toolbar-info {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .toolbar-info strong {
            color: var(--text-primary);
        }

        .toolbar-actions {
            display: flex;
            gap: 10px;
        }

        .tool-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .tool-btn.danger {
            border-color: rgba(239, 68, 68, 0.5);
            color: #ef4444;
        }

        .pages-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .pages-grid.show {
            display: grid;
        }

        .page-item {
            position: relative;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            cursor: grab;
            transition: all 0.2s;
        }

        .page-item:hover {
            border-color: var(--accent-primary);
        }

        .page-item.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        .page-item.selected {
            border-color: var(--accent-primary);
            background: rgba(239, 68, 68, 0.1);
        }

        .page-thumb {
            width: 100%;
            aspect-ratio: 3/4;
            background: white;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .page-thumb canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .page-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-number {
            font-weight: 600;
            font-size: 0.875rem;
        }

        .page-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-primary);
            cursor: pointer;
        }

        .page-delete {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            background: rgba(239, 68, 68, 0.9);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            font-size: 0.875rem;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .page-item:hover .page-delete {
            opacity: 1;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            font-size: 1.125rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: none;
        }

        .btn-primary.show {
            display: block;
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-top: 30px;
            text-align: center;
        }

        .result.show {
            display: block;
        }

        .result h3 {
            margin-bottom: 16px;
            color: var(--accent-primary);
        }

        .btn-download {
            padding: 14px 32px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>
    <div class="container">
        <a href="../index.html" class="back-link"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg> Back to Tools</a>
        <header>
            <div class="tool-icon">📋</div>
            <h1>Organize PDF</h1>
            <p class="subtitle">Reorder pages visually by drag and drop</p>
        </header>
        <div class="upload-area" id="uploadArea">
            <h3>📁 Drop PDF file here or click to upload</h3>
            <p>Select a PDF file to organize</p>
            <input type="file" id="fileInput" accept=".pdf">
        </div>
        <div class="toolbar" id="toolbar">
            <div class="toolbar-info">
                📄 <strong id="fileName"></strong> - <span id="pageCount"></span> pages
            </div>
            <div class="toolbar-actions">
                <button class="tool-btn" id="selectAllBtn">Select All</button>
                <button class="tool-btn" id="reverseBtn">Reverse Order</button>
                <button class="tool-btn danger" id="deleteSelectedBtn">Delete Selected</button>
            </div>
        </div>
        <div class="loading" id="loading" style="display:none">Loading pages...</div>
        <div class="pages-grid" id="pagesGrid"></div>
        <button class="btn-primary" id="saveBtn">Save Reorganized PDF</button>
        <div class="result" id="result">
            <h3>✅ PDF Reorganized!</h3>
            <button class="btn-download" id="downloadBtn">Download PDF</button>
        </div>
    </div>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const { PDFDocument } = PDFLib;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const toolbar = document.getElementById('toolbar');
        const fileName = document.getElementById('fileName');
        const pageCount = document.getElementById('pageCount');
        const loading = document.getElementById('loading');
        const pagesGrid = document.getElementById('pagesGrid');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const reverseBtn = document.getElementById('reverseBtn');
        const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
        const saveBtn = document.getElementById('saveBtn');
        const result = document.getElementById('result');
        const downloadBtn = document.getElementById('downloadBtn');

        let pdfBytes = null, pages = [], resultBytes = null;

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', e => e.preventDefault());
        uploadArea.addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

        async function handleFile(file) {
            if (!file || file.type !== 'application/pdf') return;
            pdfBytes = await file.arrayBuffer();
            fileName.textContent = file.name;
            loading.style.display = 'block';
            pagesGrid.classList.remove('show');
            toolbar.classList.remove('show');
            saveBtn.classList.remove('show');
            result.classList.remove('show');

            const pdf = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
            const totalPages = pdf.numPages;
            pageCount.textContent = totalPages;
            pages = [];

            pagesGrid.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 0.5 });
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                const ctx = canvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport }).promise;

                pages.push({ originalIndex: i - 1, thumbnail: canvas.toDataURL() });

                const item = document.createElement('div');
                item.className = 'page-item';
                item.dataset.index = i - 1;
                item.draggable = true;
                item.innerHTML = `
                    <div class="page-thumb"><img src="${canvas.toDataURL()}" style="width:100%;height:100%;object-fit:contain"></div>
                    <div class="page-info">
                        <span class="page-number">Page ${i}</span>
                        <input type="checkbox" class="page-checkbox">
                    </div>
                    <button class="page-delete" onclick="deletePage(${i - 1})">×</button>
                `;
                pagesGrid.appendChild(item);
            }

            loading.style.display = 'none';
            toolbar.classList.add('show');
            pagesGrid.classList.add('show');
            saveBtn.classList.add('show');
            setupDragDrop();
        }

        function setupDragDrop() {
            const items = pagesGrid.querySelectorAll('.page-item');
            let draggedItem = null;

            items.forEach(item => {
                item.addEventListener('dragstart', () => {
                    draggedItem = item;
                    item.classList.add('dragging');
                });
                item.addEventListener('dragend', () => {
                    item.classList.remove('dragging');
                    updatePageNumbers();
                });
                item.addEventListener('dragover', e => {
                    e.preventDefault();
                    if (draggedItem && draggedItem !== item) {
                        const rect = item.getBoundingClientRect();
                        const midX = rect.left + rect.width / 2;
                        if (e.clientX < midX) {
                            pagesGrid.insertBefore(draggedItem, item);
                        } else {
                            pagesGrid.insertBefore(draggedItem, item.nextSibling);
                        }
                    }
                });
            });
        }

        function updatePageNumbers() {
            pagesGrid.querySelectorAll('.page-item').forEach((item, i) => {
                item.querySelector('.page-number').textContent = `Page ${i + 1}`;
            });
        }

        window.deletePage = function (originalIndex) {
            const item = pagesGrid.querySelector(`[data-index="${originalIndex}"]`);
            if (item) {
                item.remove();
                updatePageNumbers();
            }
        };

        selectAllBtn.addEventListener('click', () => {
            const checkboxes = pagesGrid.querySelectorAll('.page-checkbox');
            const allChecked = Array.from(checkboxes).every(c => c.checked);
            checkboxes.forEach(c => c.checked = !allChecked);
        });

        reverseBtn.addEventListener('click', () => {
            const items = Array.from(pagesGrid.querySelectorAll('.page-item'));
            items.reverse().forEach(item => pagesGrid.appendChild(item));
            updatePageNumbers();
        });

        deleteSelectedBtn.addEventListener('click', () => {
            pagesGrid.querySelectorAll('.page-item').forEach(item => {
                if (item.querySelector('.page-checkbox').checked) {
                    item.remove();
                }
            });
            updatePageNumbers();
        });

        saveBtn.addEventListener('click', async () => {
            const items = pagesGrid.querySelectorAll('.page-item');
            if (items.length === 0) { alert('No pages to save'); return; }

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                const srcPdf = await PDFDocument.load(pdfBytes);
                const newPdf = await PDFDocument.create();
                const newOrder = Array.from(items).map(item => parseInt(item.dataset.index));

                for (const idx of newOrder) {
                    const [page] = await newPdf.copyPages(srcPdf, [idx]);
                    newPdf.addPage(page);
                }

                resultBytes = await newPdf.save();
                result.classList.add('show');
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Reorganized PDF';
            }
        });

        downloadBtn.addEventListener('click', () => {
            if (!resultBytes) return;
            const blob = new Blob([resultBytes], { type: 'application/pdf' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'organized.pdf';
            a.click();
        });
    </script>
</body>

</html>
