<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        /* Light Mode (Default) */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f6f8fa;
            --bg-tertiary: #ebeef1;
            --text-primary: #1f2328;
            --text-secondary: #656d76;
            --text-muted: #8b949e;
            --accent-green: #1a7f37;
            --accent-blue: #0969da;
            --accent-purple: #8250df;
            --accent-orange: #bc4c00;
            --accent-red: #cf222e;
            --accent-cyan: #0598bc;
            --border-color: #d0d7de;
            --code-bg: #0d1117;
            --code-text: #e6edf3;
        }

        /* Dark Mode */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0d1117;
                --bg-secondary: #161b22;
                --bg-tertiary: #21262d;
                --text-primary: #e6edf3;
                --text-secondary: #8b949e;
                --text-muted: #6e7681;
                --accent-green: #3fb950;
                --accent-blue: #58a6ff;
                --accent-purple: #bc8cff;
                --accent-orange: #d29922;
                --accent-red: #f85149;
                --accent-cyan: #56d4dd;
                --border-color: #30363d;
                --code-bg: #000000;
                --code-text: #e6edf3;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            font-size: 14px;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .terminal-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .terminal-window {
            background-color: var(--bg-secondary);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            .terminal-window {
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            }
        }

        .terminal-header {
            background-color: var(--bg-tertiary);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .terminal-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .btn-close {
            background-color: #ff5f56;
        }

        .btn-minimize {
            background-color: #ffbd2e;
        }

        .btn-maximize {
            background-color: #27ca40;
        }

        .terminal-title {
            color: var(--text-secondary);
            font-size: 12px;
            margin-left: 8px;
        }

        .terminal-body {
            padding: 24px;
            overflow-x: auto;
        }

        /* Typography */
        h1 {
            color: var(--accent-blue);
            font-size: 1.5em;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }

        h2 {
            color: var(--accent-purple);
            font-size: 1.1em;
            margin-top: 32px;
            margin-bottom: 16px;
        }

        h2::before {
            content: "## ";
            color: var(--text-muted);
        }

        h3 {
            color: var(--accent-cyan);
            font-size: 1em;
            margin-top: 24px;
            margin-bottom: 12px;
        }

        p {
            margin-bottom: 12px;
        }

        em {
            color: var(--accent-orange);
            font-style: normal;
        }

        strong {
            color: var(--accent-green);
            font-weight: 600;
        }

        hr {
            border: none;
            border-top: 1px dashed var(--border-color);
            margin: 24px 0;
        }

        /* Code blocks */
        code {
            background-color: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--accent-orange);
            font-size: 0.95em;
        }

        pre {
            background-color: var(--code-bg);
            border-radius: 6px;
            padding: 16px;
            margin: 16px 0;
            overflow-x: auto;
            border: 1px solid var(--border-color);
        }

        pre code {
            background: none;
            padding: 0;
            color: var(--code-text);
        }

        /* Lists */
        ul,
        ol {
            margin-left: 24px;
            margin-bottom: 12px;
        }

        li {
            margin-bottom: 4px;
        }

        li::marker {
            color: var(--accent-green);
        }

        /* Blockquotes */
        blockquote {
            border-left: 3px solid var(--accent-blue);
            padding-left: 16px;
            margin: 16px 0;
            color: var(--text-secondary);
            font-style: italic;
        }

        /* Links */
        a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        .back-link:hover {
            color: var(--accent-blue);
        }

        /* Cursor animation */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: var(--accent-green);
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }

        th,
        td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background-color: var(--bg-tertiary);
            color: var(--accent-green);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .terminal-container {
                padding: 10px;
            }

            .terminal-body {
                padding: 16px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="terminal-container">
        <a href="/" class="back-link">← cd ~</a>

        <div class="terminal-window">
            <div class="terminal-header">
                <div class="terminal-btn btn-close"></div>
                <div class="terminal-btn btn-minimize"></div>
                <div class="terminal-btn btn-maximize"></div>
                <span class="terminal-title">{{ page.title | default: "terminal" }} — bash</span>
            </div>

            <div class="terminal-body">
                {{ content }}

                <p style="margin-top: 24px; color: var(--text-muted);">$ EOF<span class="cursor"></span></p>
            </div>
        </div>
    </div>
</body>

</html>
