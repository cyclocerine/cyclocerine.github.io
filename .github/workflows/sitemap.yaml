name: Generate Sitemap

on:
  push:
    branches:
      - main  # Change this if your default branch name is different

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Required to get the full commit history
      - name: Generate sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url: 'https://cyclocerine.github.io/'  # Replace with your site URL
      - name: Check for changes
        id: changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes detected in sitemap.xml. Skipping commit."
            echo "changes-detected=false" >> $GITHUB_ENV
          else
            echo "changes-detected=true" >> $GITHUB_ENV
          fi
      - name: Commit sitemap
        if: env.changes-detected == 'true'
        run: |
          git commit -m "Add sitemap"
          git push
